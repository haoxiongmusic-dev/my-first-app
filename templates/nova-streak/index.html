<!doctype html>
<!--
  Nova Streak: a bright horizontal light streak with mirrored spectrum bars bursting left and
  right along it, over a drifting starfield (or your own background). Your cover art sits in
  the centre, pulsing on the beat, its border crackling with electric arcs on each beat.
  Without a cover the square disappears and the bars run from the centre.

  Song inputs (fixed paths, placed by the job builder): assets/song.wav, assets/audio-data.js.
  The cover arrives as a picture location (assets/images/cover.jpg in an export, the image
  route in the live preview) or "" for none. The committed root duration (20 s) matches the
  generated sample song; the job builder sets every data-song-length element to the real
  song's length. The motion maths lives in assets/streak-motion.js (unit-tested).
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"SONG NAME","maxLength":60},
    {"id":"artist","type":"string","label":"Artist","default":"ARTIST NAME","maxLength":60},
    {"id":"font","type":"enum","label":"Font","default":"Montserrat","options":[
      {"value":"Montserrat","label":"Montserrat"},
      {"value":"Inter","label":"Inter"},
      {"value":"Outfit","label":"Outfit"},
      {"value":"Poppins","label":"Poppins"},
      {"value":"Lato","label":"Lato"},
      {"value":"Oswald","label":"Oswald"},
      {"value":"Playfair Display","label":"Playfair Display"},
      {"value":"EB Garamond","label":"EB Garamond"}]},
    {"id":"cover","type":"image","label":"Cover art","default":"","fit":"square"},
    {"id":"mainColor","type":"color","label":"Main color","default":"#ff2fb3"},
    {"id":"accentColor","type":"color","label":"Accent color","default":"#8a3cff"},
    {"id":"intensity","type":"number","label":"Intensity","default":1,"min":0.2,"max":2,"step":0.1},
    {"id":"borderGlow","type":"number","label":"Border glow","default":70,"min":0,"max":100,"step":1,"unit":"%"},
    {"id":"starDensity","type":"number","label":"Star density","default":100,"min":0,"max":200,"step":1,"unit":"%"},
    {"id":"showBackground","type":"boolean","label":"Show background","default":false},
    {"id":"backgroundBlur","type":"number","label":"Background blur","default":60,"min":0,"max":100,"step":1,"unit":"%"},
    {"id":"beatRange","type":"enum","label":"Beat range","default":"kick","options":[
      {"value":"kick","label":"Kick (auto)"},
      {"value":"20-90","label":"20–90 Hz"},
      {"value":"90-200","label":"90–200 Hz"},
      {"value":"20-200","label":"20–200 Hz"},
      {"value":"200-600","label":"200–600 Hz"},
      {"value":"600-3000","label":"600–3000 Hz"},
      {"value":"3000-8000","label":"3000–8000 Hz"},
      {"value":"8000-20000","label":"8000–20000 Hz"},
      {"value":"20-20000","label":"20–20000 Hz"}]},
    {"id":"spectrumLow","type":"number","label":"Spectrum low","default":30,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumHigh","type":"number","label":"Spectrum high","default":1000,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumBoost","type":"enum","label":"Spectrum boost","default":"2","options":[
      {"value":"1","label":"1×"},
      {"value":"2","label":"2×"},
      {"value":"4","label":"4×"},
      {"value":"8","label":"8×"}]},
    {"id":"bandCount","type":"number","label":"Bands","default":100,"min":10,"max":100,"step":1,"unit":"%"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/audio-data.js"></script>
    <script src="assets/viz-toolkit.js"></script>
    <script src="assets/streak-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
      }
      #viz {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #titles {
        position: absolute;
        left: 0;
        right: 0;
        top: 760px;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        color: #f6f0ff;
        opacity: 0;
      }
      #titleLine {
        display: table; /* as wide as its text, so it can be measured and shrunk to fit */
        margin-left: auto;
        margin-right: auto;
        font-size: 34px;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #bgImage,
      #coverImg,
      #fontPreload {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
      /* Mentioning every font family lets HyperFrames bundle them all for the Font setting. */
      .f-montserrat {
        font-family: "Montserrat";
      }
      .f-inter {
        font-family: "Inter";
      }
      .f-outfit {
        font-family: "Outfit";
      }
      .f-poppins {
        font-family: "Poppins";
      }
      .f-lato {
        font-family: "Lato";
      }
      .f-oswald {
        font-family: "Oswald";
      }
      .f-playfair {
        font-family: "Playfair Display";
      }
      .f-garamond {
        font-family: "EB Garamond";
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="viz" width="1920" height="1080"></canvas>
      <div
        id="titles"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="0"
      >
        <div id="titleLine">
          <span id="artist" data-var-text="artist">ARTIST NAME</span><span id="dash"> – </span
          ><span id="title" data-var-text="title">SONG NAME</span>
        </div>
      </div>
      <div
        id="fade"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="2"
      ></div>
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="1"
        data-volume="1"
        src="assets/song.wav"
      ></audio>
    </div>
    <img id="bgImage" src="assets/background.jpg" alt="" />
    <img id="coverImg" alt="" />
    <div id="fontPreload" aria-hidden="true">
      <span class="f-montserrat">Aa</span><span class="f-inter">Aa</span>
      <span class="f-outfit">Aa</span><span class="f-poppins">Aa</span>
      <span class="f-lato">Aa</span><span class="f-oswald">Aa</span>
      <span class="f-playfair">Aa</span><span class="f-garamond">Aa</span>
    </div>
    <script>
      (function () {
        var V = window.VizToolkit;
        var M = window.StreakMotion;
        // Settings: the template's own declared defaults, overridden by the values HyperFrames
        // passes in (render) and, in the editor's live preview, by runtime-data messages.
        var DEFAULTS = V.declaredDefaults(
          document.documentElement.getAttribute("data-composition-variables"),
        );
        var given =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var vars = {};
        for (var id in DEFAULTS) vars[id] = DEFAULTS[id];
        for (var key in given)
          if (given[key] !== undefined && given[key] !== null) vars[key] = given[key];
        function setting(id) {
          return vars[id];
        }
        // Drawing resolution: always full size, except in the editor's preview (runtime data).
        var PREVIEW_SCALE = 1;
        var DURATION =
          parseFloat(document.getElementById("root").getAttribute("data-duration")) || 20;

        var drawing = null; // { render(t), uploadCover(), dispose() } from setup()
        var lastTime = -1;

        // ---------- the cover picture ----------
        // The location is set at once, so the page's own loading waits for it; the frame is
        // drawn again when it arrives. A picture that fails to load is simply left out.
        var coverImg = document.getElementById("coverImg");
        var coverSrc = "";
        var coverLoaded = false;
        coverImg.addEventListener("load", function () {
          coverLoaded = true;
          if (drawing) drawing.uploadCover();
          draw(Math.max(0, lastTime));
        });
        coverImg.addEventListener("error", function () {
          coverLoaded = false;
          draw(Math.max(0, lastTime));
        });
        function setCover(value) {
          // HyperFrames hands an image setting over as text; accept { url } as well.
          var src = value && typeof value === "object" ? value.url || "" : value || "";
          if (src === coverSrc) return;
          coverSrc = src;
          coverLoaded = false;
          if (src) coverImg.src = src;
          else coverImg.removeAttribute("src");
        }
        setCover(setting("cover"));

        // ---------- the title line: "ARTIST – SONG" ----------
        function rgba(hex, alpha) {
          var c = V.hexToRGB(hex);
          return (
            "rgba(" +
            Math.round(c[0] * 255) +
            "," +
            Math.round(c[1] * 255) +
            "," +
            Math.round(c[2] * 255) +
            "," +
            alpha +
            ")"
          );
        }
        function applyPage() {
          var titles = document.getElementById("titles");
          titles.style.fontFamily = '"' + setting("font") + '", sans-serif';
          titles.style.textShadow = "0 0 22px " + rgba(setting("mainColor"), 0.65);
          var both = String(setting("title")).trim() && String(setting("artist")).trim();
          document.getElementById("dash").style.display = both ? "" : "none";
        }
        applyPage();

        // Shrink the title line until it fits the 80 % title-safe width. Measured on seeks,
        // settings and font loads only, never in the timeline callback.
        var TITLE_SAFE = 1536;
        var TITLE_SIZE = 34;
        var fitted = "";
        function fitTitles() {
          var line = document.getElementById("titleLine");
          var loaded = 0;
          if (document.fonts)
            document.fonts.forEach(function (face) {
              if (face.status === "loaded") loaded++;
            });
          var key = [line.textContent, setting("font"), loaded].join("|");
          if (key === fitted) return;
          fitted = key;
          var size = TITLE_SIZE;
          line.style.fontSize = size + "px";
          while (line.offsetWidth > TITLE_SAFE && size > 12) {
            size = Math.floor(size * 0.95);
            line.style.fontSize = size + "px";
          }
        }

        // ---------- shaders ----------
        // Shapes (bars, border, arcs) are triangles in 1080p pixels from the frame centre,
        // y down, so they keep their size at every preview resolution.
        var SHAPE_VS = [
          "attribute vec2 pos; attribute vec3 col; varying vec3 vCol;",
          "void main(){ vCol = col; gl_Position = vec4(pos.x / 960.0, -pos.y / 540.0, 0.0, 1.0); }",
        ].join("\n");
        var SHAPE_FS = [
          "precision mediump float; varying vec3 vCol;",
          "void main(){ gl_FragColor = vec4(vCol, 1.0); }",
        ].join("\n");
        // Stars: points in 1080p pixels from the top-left corner.
        var STAR_VS = [
          "attribute vec4 star; uniform float pxScale; varying float vB;",
          "void main(){",
          "  vB = star.w;",
          "  gl_PointSize = star.z * 2.0 * pxScale;",
          "  gl_Position = vec4(star.x / 960.0 - 1.0, 1.0 - star.y / 540.0, 0.0, 1.0);",
          "}",
        ].join("\n");
        var STAR_FS = [
          "precision mediump float; varying float vB;",
          "void main(){",
          "  vec2 d = gl_PointCoord - 0.5;",
          "  gl_FragColor = vec4(vec3(0.86, 0.9, 1.0) * exp(-dot(d, d) * 10.0) * vB, 1.0);",
          "}",
        ].join("\n");
        var QUAD_VS =
          "attribute vec2 p; varying vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }";
        var COPY_FS =
          "precision highp float; uniform sampler2D src; varying vec2 uv; void main(){ gl_FragColor = texture2D(src, uv); }";
        var BLUR_FS = [
          "precision highp float;",
          "uniform sampler2D src; uniform vec2 dir; varying vec2 uv;",
          "void main(){",
          "  vec3 c = texture2D(src, uv).rgb * 0.227027;",
          "  c += texture2D(src, uv + dir * 1.3846).rgb * 0.316216; c += texture2D(src, uv - dir * 1.3846).rgb * 0.316216;",
          "  c += texture2D(src, uv + dir * 3.2308).rgb * 0.070270; c += texture2D(src, uv - dir * 3.2308).rgb * 0.070270;",
          "  gl_FragColor = vec4(c, 1.0);",
          "}",
        ].join("\n");
        // Everything combined: the background (stars or picture) with a soft colour haze, the
        // cover, then the light (streak, bars, border, arcs and their glow) screened on top.
        var COMPOSITE_FS = [
          "precision highp float;",
          "uniform sampler2D scene, bloomA, bloomB, bg, cover;",
          "uniform float bgGain, hasCover, coverHalf, level, loud, coreW, coreGain;",
          "uniform vec3 mainCol, accCol;",
          "varying vec2 uv;",
          "void main(){",
          "  vec2 px = vec2((uv.x - 0.5) * 1920.0, (0.5 - uv.y) * 1080.0);",
          "  vec3 base = texture2D(bg, uv).rgb * bgGain;",
          "  vec3 hazeCol = mix(mainCol, accCol, smoothstep(0.0, 900.0, abs(px.x)));",
          "  base += hazeCol * exp(-pow(px.y / 260.0, 2.0)) * 0.12 * (0.75 + 0.5 * loud);",
          "  float inCover = hasCover * step(abs(px.x), coverHalf) * step(abs(px.y), coverHalf);",
          "  vec2 cuv = px / max(coverHalf, 1.0) * 0.5 + 0.5;",
          "  base = mix(base, texture2D(cover, vec2(cuv.x, 1.0 - cuv.y)).rgb, inCover);",
          "  float dy = abs(px.y);",
          "  float fx = exp(-pow(px.x / 1150.0, 2.0));",
          "  float core = exp(-pow(dy / coreW, 2.0)) * coreGain;",
          "  float glow = exp(-dy / 14.0) * 0.55 + exp(-pow(dy / 90.0, 2.0)) * 0.22;",
          "  vec3 streak = (mix(mainCol, vec3(1.0), 0.78) * core * 1.6 + mainCol * glow) * fx * level;",
          "  streak *= 1.0 - inCover;",
          "  vec3 light = texture2D(scene, uv).rgb + texture2D(bloomA, uv).rgb * 0.75 + texture2D(bloomB, uv).rgb * 1.0 + streak;",
          "  light = vec3(1.0) - exp(-light * 1.4);",
          "  vec3 c = vec3(1.0) - (vec3(1.0) - base) * (vec3(1.0) - light);",
          "  c *= mix(0.7, 1.0, smoothstep(1.2, 0.4, length((uv - 0.5) * vec2(1.3, 1.0))));",
          "  gl_FragColor = vec4(c, 1.0);",
          "}",
        ].join("\n");

        // ---------- set up drawing (any error is shown on the frame) ----------
        function setup() {
          var MAIN = V.hexToRGB(setting("mainColor"));
          var ACC = V.hexToRGB(setting("accentColor"));
          var INT = setting("intensity");
          var GLOW = setting("borderGlow");
          var SHOW_BG = setting("showBackground") === true;
          var BG_BLUR = setting("backgroundBlur");
          var BARS = M.bandsToCount(setting("bandCount"));
          var audio = V.createAudio(window.AUDIO_DATA, {
            beatRange: setting("beatRange"),
            spectrumLow: setting("spectrumLow"),
            spectrumHigh: setting("spectrumHigh"),
            spectrumBoost: Number(setting("spectrumBoost")),
            spectrumCount: BARS,
          });
          var STARS = SHOW_BG
            ? new Float32Array(0)
            : M.buildStars(setting("starDensity"), V.mulberry32);
          var STAR_N = STARS.length / 5;
          var spec = new Float32Array(BARS);

          var W = Math.round(1920 * PREVIEW_SCALE),
            H = Math.round(1080 * PREVIEW_SCALE);
          var canvas = document.getElementById("viz");
          if (canvas.width !== W) canvas.width = W;
          if (canvas.height !== H) canvas.height = H;
          var rawGl = canvas.getContext("webgl", {
            preserveDrawingBuffer: true,
            antialias: false,
            alpha: false,
          });
          if (!rawGl) throw new Error("WebGL is not available in this browser");
          // Everything made through `gl` is freed by dispose(), so live changes don't leak.
          var tracked = V.trackGl(rawGl);
          var gl = tracked.gl;

          // Light is drawn sharp into `scene`, then blurred at half and quarter size for glow.
          var scene = V.createTarget(gl, W, H);
          var hA = V.createTarget(gl, Math.round(W / 2), Math.round(H / 2)),
            hB = V.createTarget(gl, Math.round(W / 2), Math.round(H / 2));
          var qA = V.createTarget(gl, Math.round(W / 4), Math.round(H / 4)),
            qB = V.createTarget(gl, Math.round(W / 4), Math.round(H / 4));
          var sky = V.createTarget(gl, W, H); // the starfield, drawn each frame

          function blankTexture() {
            var tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            var black = new Uint8Array([0, 0, 0, 255]);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, black);
            return tex;
          }

          // Background picture (optional): drawn once, cover-cropped and blurred, as a texture.
          var bgTex = blankTexture();
          var bgReady = false;
          function loadBackground() {
            var img = document.getElementById("bgImage");
            if (bgReady || !SHOW_BG || !img || !img.complete || !img.naturalWidth) return;
            var c2 = document.createElement("canvas");
            c2.width = W;
            c2.height = H;
            var ctx = c2.getContext("2d");
            var blurPx = (BG_BLUR / 100) * 80 * PREVIEW_SCALE;
            ctx.filter = blurPx > 0 ? "blur(" + blurPx + "px)" : "none";
            var pad = blurPx * 2; // draw past the edges so the blur doesn't darken them
            var scale = Math.max(
              (W + 2 * pad) / img.naturalWidth,
              (H + 2 * pad) / img.naturalHeight,
            );
            var dw = img.naturalWidth * scale,
              dh = img.naturalHeight * scale;
            ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
            gl.bindTexture(gl.TEXTURE_2D, bgTex);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            bgReady = true;
          }

          // The cover, square-cropped to 512 px (a power of two, so it can be mipmapped and
          // stays crisp when drawn at 360 px).
          var coverTex = blankTexture();
          var coverReady = false;
          function uploadCover() {
            coverReady = false;
            if (!coverLoaded || !coverImg.naturalWidth) return;
            var c2 = document.createElement("canvas");
            c2.width = 512;
            c2.height = 512;
            var w = coverImg.naturalWidth,
              h = coverImg.naturalHeight,
              s = Math.min(w, h);
            c2.getContext("2d").drawImage(coverImg, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 512, 512);
            gl.bindTexture(gl.TEXTURE_2D, coverTex);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.generateMipmap(gl.TEXTURE_2D);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            coverReady = true;
          }
          uploadCover();

          var shapeProg = V.createProgram(gl, SHAPE_VS, SHAPE_FS);
          var starProg = V.createProgram(gl, STAR_VS, STAR_FS);
          var copyProg = V.createProgram(gl, QUAD_VS, COPY_FS);
          var blurProg = V.createProgram(gl, QUAD_VS, BLUR_FS);
          var compProg = V.createProgram(gl, QUAD_VS, COMPOSITE_FS);
          var shapeBuf = gl.createBuffer();
          var starBuf = gl.createBuffer();
          var starData = new Float32Array(4 * STAR_N);

          // Triangles for the frame's shapes: x, y, r, g, b per vertex.
          var verts = new Float32Array(5 * 6 * 2048);
          var nv = 0;
          function vert(x, y, c, k) {
            if (5 * (nv + 1) > verts.length) {
              var bigger = new Float32Array(verts.length * 2);
              bigger.set(verts);
              verts = bigger;
            }
            var o = 5 * nv++;
            verts[o] = x;
            verts[o + 1] = y;
            verts[o + 2] = c[0] * k;
            verts[o + 3] = c[1] * k;
            verts[o + 4] = c[2] * k;
          }
          /** A quad a-b-c-d (corners in order), coloured cA at a/b and cB at c/d. */
          function quad(ax, ay, bx, by, cx, cy, dx, dy, cA, kA, cB, kB) {
            vert(ax, ay, cA, kA);
            vert(bx, by, cA, kA);
            vert(cx, cy, cB, kB);
            vert(ax, ay, cA, kA);
            vert(cx, cy, cB, kB);
            vert(dx, dy, cB, kB);
          }
          /**
           * A line this many 1080p pixels wide, never thinner than about one screen pixel:
           * a thinner line is drawn wider and dimmer, so the preview shows what the render
           * shows when scaled down.
           */
          function thin(width) {
            var w = Math.max(width, 1.2 / PREVIEW_SCALE);
            return [w, width / w];
          }
          function segment(x0, y0, x1, y1, width, c, k) {
            var t = thin(width);
            var dx = x1 - x0,
              dy = y1 - y0;
            var len = Math.sqrt(dx * dx + dy * dy) || 1;
            var nx = (-dy / len) * (t[0] / 2),
              ny = (dx / len) * (t[0] / 2);
            var kk = k * t[1];
            quad(
              x0 + nx,
              y0 + ny,
              x1 + nx,
              y1 + ny,
              x1 - nx,
              y1 - ny,
              x0 - nx,
              y0 - ny,
              c,
              kk,
              c,
              kk,
            );
          }
          function mixRGB(a, b, f) {
            return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
          }
          var WHITE = [1, 1, 1];
          var ARC_COL = mixRGB(MAIN, WHITE, 0.65);

          function buildShapes(t, hasCover, half) {
            nv = 0;
            // Bars: up and down from the streak, mirrored left and right; bass in the middle.
            var layout = M.barLayout(BARS, hasCover);
            var heights = M.barHeights(audio.spectrum(t, spec), INT);
            var bw = layout.width * 0.28;
            for (var i = 0; i < BARS; i++) {
              var hgt = heights[i];
              if (hgt < 0.5) continue;
              var x = layout.centres[i];
              var col = mixRGB(MAIN, ACC, (x - layout.inner) / (layout.outer - layout.inner));
              for (var side = -1; side <= 1; side += 2) {
                var x0 = side * x - bw,
                  x1 = side * x + bw;
                quad(x0, 0, x1, 0, x1, -hgt, x0, -hgt, col, 0.85, col, 0.15); // up
                quad(x0, 0, x1, 0, x1, hgt, x0, hgt, col, 0.85, col, 0.15); // down
              }
            }
            if (!hasCover) return;
            // The cover's glowing border: a soft wide line under a bright thin one …
            var k = 0.6 + 0.8 * (GLOW / 100);
            var edges = [
              [-half - 1.5, -half, half + 1.5, -half],
              [half, -half, half, half],
              [half + 1.5, half, -half - 1.5, half],
              [-half, half, -half, -half],
            ];
            for (var e = 0; e < 4; e++) {
              var g = edges[e];
              segment(g[0], g[1], g[2], g[3], 10, MAIN, 0.25 * k);
              segment(g[0], g[1], g[2], g[3], 3, MAIN, k);
            }
            // … and the electric arcs crackling along it on each beat: a coloured glow with a
            // near-white core.
            var arcs = M.arcBursts(audio, t, half, GLOW, V.mulberry32);
            for (var a = 0; a < arcs.length; a++) {
              var p = arcs[a].points;
              var bright = arcs[a].alpha;
              for (var j = 0; j + 3 < p.length; j += 2) {
                segment(p[j], p[j + 1], p[j + 2], p[j + 3], 9, MAIN, 0.7 * bright);
                segment(p[j], p[j + 1], p[j + 2], p[j + 3], 2.5, ARC_COL, 2.2 * bright);
              }
            }
          }

          function bindTarget(tg) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, tg ? tg.fb : null);
            gl.viewport(0, 0, tg ? tg.w : W, tg ? tg.h : H);
          }
          function copy(src, dst) {
            bindTarget(dst);
            gl.useProgram(copyProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, src.tex);
            gl.uniform1i(copyProg.u.src, 0);
            V.drawQuad(gl, copyProg);
          }
          function drawArrays(prog, buffer, data, count, mode, layout) {
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
            var stride = 0;
            for (var i = 0; i < layout.length; i++) stride += layout[i][1];
            var locs = [],
              offset = 0;
            for (var j = 0; j < layout.length; j++) {
              var loc = gl.getAttribLocation(prog, layout[j][0]);
              gl.enableVertexAttribArray(loc);
              gl.vertexAttribPointer(loc, layout[j][1], gl.FLOAT, false, stride * 4, offset * 4);
              offset += layout[j][1];
              locs.push(loc);
            }
            gl.drawArrays(mode, 0, count);
            for (var k = 0; k < locs.length; k++) gl.disableVertexAttribArray(locs[k]);
          }

          var CORE = thin(2.8); // the streak's bright core: width and brightness

          function renderAt(t) {
            loadBackground();
            var a = audio.sample(t);
            var hasCover = coverReady && coverLoaded;
            var half = 180 * M.coverScale(M.coverEnvelope(audio, t), INT);
            var songTime = t + audio.songStart;

            // 1. the starfield (or nothing, when a background picture is shown)
            bindTarget(sky);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            if (STAR_N > 0) {
              var twinkle = M.starTwinkle(audio, t);
              for (var s = 0; s < STAR_N; s++) {
                var depth = STARS[5 * s + 2];
                starData[4 * s] = M.starX(STARS[5 * s], depth, songTime);
                starData[4 * s + 1] = STARS[5 * s + 1];
                starData[4 * s + 2] = STARS[5 * s + 3];
                starData[4 * s + 3] = STARS[5 * s + 4] * (0.45 + 0.55 * depth) * twinkle;
              }
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.ONE, gl.ONE);
              gl.useProgram(starProg);
              gl.uniform1f(starProg.u.pxScale, PREVIEW_SCALE);
              drawArrays(starProg, starBuf, starData, STAR_N, gl.POINTS, [["star", 4]]);
              gl.disable(gl.BLEND);
            }

            // 2. light: bars, border and arcs, added together
            buildShapes(t, hasCover, half);
            bindTarget(scene);
            gl.clear(gl.COLOR_BUFFER_BIT);
            if (nv > 0) {
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.ONE, gl.ONE);
              gl.useProgram(shapeProg);
              drawArrays(shapeProg, shapeBuf, verts.subarray(0, 5 * nv), nv, gl.TRIANGLES, [
                ["pos", 2],
                ["col", 3],
              ]);
              gl.disable(gl.BLEND);
            }

            // 3. glow: half-size medium, quarter-size wide (radii kept in 1080p terms)
            copy(scene, hA);
            V.blur(gl, blurProg, hA, hB, 1.5 * PREVIEW_SCALE);
            V.blur(gl, blurProg, hA, hB, 3.0 * PREVIEW_SCALE);
            copy(hA, qA);
            V.blur(gl, blurProg, qA, qB, 1.5 * PREVIEW_SCALE);
            V.blur(gl, blurProg, qA, qB, 3.0 * PREVIEW_SCALE);

            // 4. everything onto the screen
            bindTarget(null);
            gl.useProgram(compProg);
            var units = [
              ["scene", scene.tex],
              ["bloomA", hA.tex],
              ["bloomB", qA.tex],
              ["bg", SHOW_BG ? bgTex : sky.tex],
              ["cover", coverTex],
            ];
            for (var u = 0; u < units.length; u++) {
              gl.activeTexture(gl.TEXTURE0 + u);
              gl.bindTexture(gl.TEXTURE_2D, units[u][1]);
              gl.uniform1i(compProg.u[units[u][0]], u);
            }
            gl.uniform1f(compProg.u.bgGain, SHOW_BG ? (bgReady ? 0.5 : 0) : 1);
            gl.uniform1f(compProg.u.hasCover, hasCover ? 1 : 0);
            gl.uniform1f(compProg.u.coverHalf, half);
            gl.uniform1f(compProg.u.level, M.streakLevel(a.loud, INT));
            gl.uniform1f(compProg.u.loud, a.loud);
            gl.uniform1f(compProg.u.coreW, CORE[0] / 2);
            gl.uniform1f(compProg.u.coreGain, CORE[1]);
            gl.uniform3fv(compProg.u.mainCol, MAIN);
            gl.uniform3fv(compProg.u.accCol, ACC);
            V.drawQuad(gl, compProg);
            gl.activeTexture(gl.TEXTURE0);
          }
          return { render: renderAt, uploadCover: uploadCover, dispose: tracked.dispose };
        }

        function fail(error) {
          V.showError(String((error && error.message) || error));
        }
        function draw(t) {
          if (!drawing) return;
          try {
            drawing.render(t);
            lastTime = t;
          } catch (error) {
            drawing = null;
            fail(error);
          }
        }
        /** (Re)create everything that depends on the settings, freeing what came before. */
        function rebuild() {
          if (drawing) drawing.dispose();
          drawing = null;
          try {
            drawing = setup();
            var shown = document.getElementById("viz-error");
            if (shown) shown.remove();
          } catch (error) {
            fail(error);
          }
        }
        rebuild();
        fitTitles();
        draw(0);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitles);
        if (document.fonts && document.fonts.addEventListener) {
          document.fonts.addEventListener("loadingdone", function () {
            fitTitles();
          });
        }
        window.addEventListener("hf-seek", function (e) {
          fitTitles(); // titles are measured here, not in the timeline callback below
          draw(e.detail.time);
        });

        // Live preview (the editor): new settings or a new preview resolution arrive as
        // runtime data. Renders never send any, so they look exactly as without this.
        var hf = window.__hyperframes;
        if (hf && hf.registerRuntimeDataHandler) {
          hf.registerRuntimeDataHandler("settings", function (values) {
            if (!values || typeof values !== "object") return;
            for (var key in values) if (key in DEFAULTS) vars[key] = values[key];
            document.getElementById("title").textContent = setting("title");
            document.getElementById("artist").textContent = setting("artist");
            setCover(setting("cover"));
            applyPage();
            fitTitles();
            rebuild();
            draw(Math.max(0, lastTime));
          });
          hf.registerRuntimeDataHandler("preview", function (data) {
            var scale = Number(data && data.scale);
            if (!(scale > 0 && scale <= 1) || scale === PREVIEW_SCALE) return;
            PREVIEW_SCALE = scale;
            rebuild();
            draw(Math.max(0, lastTime));
          });
        }

        // Titles fade in; the whole picture fades to black over the song's last 2.5 s.
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#titles",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 1.6, ease: "power2.out" },
          0.3,
        );
        tl.to(
          "#fade",
          { opacity: 1, duration: 2.5, ease: "power1.in" },
          Math.max(0, DURATION - 2.5),
        );
        // While the preview plays, the runtime advances this timeline (hf-seek only comes on
        // jumps), so draw on every timeline update too.
        tl.eventCallback("onUpdate", function () {
          var t = tl.time();
          if (t !== lastTime) draw(t);
        });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
