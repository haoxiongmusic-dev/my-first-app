<!doctype html>
<!--
  Live Wire: a chrome loudspeaker on a dark cracked concrete wall, lit from the middle. The
  speaker, built from voxels and seen straight on: a glowing edge in the main colour, a thick
  dark chrome rim with eight screws, a rubber surround, a bright brushed silver cone stepping
  down into a bowl, and a glossy black dust cap. Four thick black cables leave the rim through
  chrome plugs (two each side) and curve out in S-shapes to the frame's four corners, lying in
  grooves in the wall. Electric arcs (main colour, white cores) crawl along the cables toward the
  speaker and crackle round its rim, sparks round the rim follow the spectrum, and on strong hits
  a bright arc jumps from a cable to the rim and concrete debris flies out. The title above the
  speaker and the artist below it in a bold metallic style (bevelled silver, a rim light in the
  main colour, a dark outline).
  Spec: docs/superpowers/specs/2026-11-10-m9-final-templates-design.md §5.5

  Built with three.js, following Prism Heart's rules: colour management off, no tone mapping and
  linear output (preset colours come out exactly as picked), every render target 8-bit (half
  float renders blank on this PC), the renderer built once (settings only update materials).
    1. The wall: one shader (concrete, a crack network, the grooves, the cables, the light from
       the middle) drawn once into its own 8-bit target; each frame only copies it, lit by the
       speaker's glow and shaken on strong hits.
    2. The speaker: the voxel parts (assets/speaker-voxels.js) as instanced cubes, matt with their
       chrome shading baked in; the cone, surround and cap are one group scaled by the bass.
    3. The arcs, the sparks, the debris streaks and the text: an overlay in 1080p pixels.

  Song inputs (fixed paths, placed by the job builder): assets/song.wav, assets/audio-data.js.
  The committed root duration (20 s) matches the generated sample song; the job builder sets
  every data-song-length element to the real song's length. The motion maths lives in
  assets/wire-motion.js (unit-tested).
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"SONG NAME","maxLength":60},
    {"id":"artist","type":"string","label":"Artist","default":"ARTIST NAME","maxLength":60},
    {"id":"font","type":"enum","label":"Font","default":"Oswald","options":[

    {"id":"intensity","type":"number","label":"Intensity","default":1,"min":0.2,"max":2,"step":0.1},
    {"id":"shakeOnBeat","type":"boolean","label":"Shake on beat","default":true},
    {"id":"showDebris","type":"boolean","label":"Show debris","default":true},
    {"id":"beatRange","type":"enum","label":"Beat range","default":"kick","options":[

      {"value":"90-200","label":"90–200 Hz"},

      {"value":"600-3000","label":"600–3000 Hz"},
      {"value":"3000-8000","label":"3000–8000 Hz"},
      {"value":"8000-20000","label":"8000–20000 Hz"},
      {"value":"20-20000","label":"20–20000 Hz"}]},
    {"id":"spectrumLow","type":"number","label":"Spectrum low","default":30,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumHigh","type":"number","label":"Spectrum high","default":1000,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumBoost","type":"enum","label":"Spectrum boost","default":"8","options":[

>
  <head>

    <script src="assets/audio-data.js"></script>

    <script src="assets/wire-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>

  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"

    <div id="fontPreload" aria-hidden="true">
      <span class="f-montserrat">Aa<b>Aa</b></span
      ><span class="f-inter">Aa<b>Aa</b></span> <span class="f-outfit">Aa<b>Aa</b></span
      ><span class="f-poppins">Aa<b>Aa</b></span> <span class="f-lato">Aa<b>Aa</b></span
      ><span class="f-oswald">Aa<b>Aa</b></span> <span class="f-playfair">Aa<b>Aa</b></span
      ><span class="f-garamond">Aa<b>Aa</b></span>
    </div>
    <script>
      (function () {
        var V = window.VizToolkit;
        var K = window.THREE_KIT;
        var THREE = K.THREE;
        var M = window.WireMotion;
        var SP = window.LiveWireSpeaker;
        // Colours are plain display values, as in the other WebGL templates.
        THREE.ColorManagement.enabled = false;
        // Settings: the template's own declared defaults, overridden by the values HyperFrames
        // passes in (render) and, in the editor's live preview, by runtime-data messages.
        var DEFAULTS = V.declaredDefaults(
          document.documentElement.getAttribute("data-composition-variables"),
        );
        var given =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var vars = {};
        for (var id in DEFAULTS) vars[id] = DEFAULTS[id];
        for (var key in given)
          if (given[key] !== undefined && given[key] !== null) vars[key] = given[key];
        function setting(id) {
          return vars[id];
        }
        // Drawing resolution: always full size, except in the editor's preview (runtime data).
        var PREVIEW_SCALE = 1;
        var DURATION =
          parseFloat(document.getElementById("root").getAttribute("data-duration")) || 20;

        // ---------- the layout (1080p pixels, y down) ----------
        var CX = M.CENTRE.x,
          CY = M.CENTRE.y;
        var TITLE = { top: 104, bottom: 318, width: 1380 };
        var ARTIST = { y: 810, size: 58, width: 1100 };
        var BEAT_RELEASE = 0.15; // the cone's kick
        var RING_R = M.RIM_PX + 3; // the arcs crackling round the rim
        var SPARK_MAX = 72; // px: the spectrum's sparks round the rim
        var SPARK_FULL = 40; // sparks round the rim at Bands 100 %
        var CABLE_W = 30; // px: a cable's thickness
        var GROOVE_W = 50; // px: its groove's
        var ARC_GLOW = 20; // px: an arc's soft glow (full width) …
        var ARC_CORE = 2.8; // … and its white core

        // ---------- the speaker (voxel units; 8 px each at z = 0) ----------
        var CAM_FOV = 30;
        var VIEW_HALF_H = 540 / M.VOXEL_PX; // half the frame's height at z = 0
        var CAM_DIST = VIEW_HALF_H / Math.tan(((CAM_FOV / 2) * Math.PI) / 180);
        var CHROME = [0.9, 0.94, 1.0]; // a cool steel tint
        var CHIP_Z = 9; // the debris chips fly this far in front of the wall

        /** [r, g, b] 0..1 mixes. */
        function mix(a, b, f) {
          return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
        }
        function scale3(a, k) {
          return [a[0] * k, a[1] * k, a[2] * k];
        }
        function css(rgb, alpha) {
          return (
            "rgba(" +
            Math.round(Math.max(0, Math.min(1, rgb[0])) * 255) +
            "," +
            Math.round(Math.max(0, Math.min(1, rgb[1])) * 255) +
            "," +
            Math.round(Math.max(0, Math.min(1, rgb[2])) * 255) +
            "," +
            alpha +
            ")"
          );
        }
        var WHITE = [1, 1, 1];

        // the cables' paths (1080p px), shared by the wall's grooves and the arcs
        var CABLES = [0, 1, 2, 3].map(function (c) {
          return M.cablePath(c, 96);
        });

        // ---------- shaders ----------
        var QUAD_VS = [
          "varying vec2 vUv;",
          "void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        ].join("\n");
        // 1. The wall, drawn once: concrete (stains, grain and pores), a seeded crack network,
        // the marks drawn on a canvas (the speaker's impact cracks and the cables' grooves), the
        // cables lying in them, and the light from the middle, darker toward the edges.
        var WALL_FS = [
          "uniform sampler2D marks, cables;",
          "uniform float px;",
          "varying vec2 vUv;",
          "float hash2(vec2 p){ return fract(sin(dot(mod(p, 256.0), vec2(12.9898, 78.233))) * 43758.5453); }",
          "float vnoise(vec2 p){",
          "  vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);",
          "  float a = hash2(i), b = hash2(i + vec2(1.0, 0.0));",
          "  float c = hash2(i + vec2(0.0, 1.0)), d = hash2(i + vec2(1.0, 1.0));",
          "  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);",
          "}",
          "float fbm(vec2 p){",
          "  float s = 0.0, a = 0.5;",
          "  for (int k = 0; k < 5; k++) { s += a * vnoise(p); p = p * 2.03 + vec2(17.0, 9.0); a *= 0.5; }",
          "  return s / 0.97;",
          "}",
          // the distance to the nearest edge of a jittered cell pattern (the crack network)
          "float cellEdge(vec2 p){",
          "  vec2 i = floor(p); vec2 f = fract(p);",
          "  float d1 = 8.0, d2 = 8.0;",
          "  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {",
          "    vec2 g = vec2(float(x), float(y));",
          "    vec2 o = vec2(hash2(i + g + 3.0), hash2(i + g + 19.0));",
          "    float d = length(g + o - f);",
          "    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }",
          "  }",
          "  return d2 - d1;",
          "}",
          "void main(){",
          "  vec2 p = vec2(vUv.x * 1920.0, (1.0 - vUv.y) * 1080.0);",
          "  vec2 uv = p / vec2(1920.0, 1080.0);",
          // concrete: big stains, mid mottling, fine grain and small pores
          "  float big = fbm(p / 430.0 + 3.1);",
          "  float mid = fbm(p / 85.0 + 11.7);",
          "  float grain = vnoise(p / 2.4);",
          "  float g = 0.3 + 0.2 * (big - 0.5) + 0.11 * (mid - 0.5) + 0.035 * (grain - 0.5);",
          "  vec2 cell = floor(p / 11.0);",
          "  float h = hash2(cell + 5.0);",
          "  if (h > 0.9) {",
          "    vec2 c = (cell + 0.25 + 0.5 * vec2(hash2(cell + 1.0), hash2(cell + 2.0))) * 11.0;",
          "    float rad = 0.6 + 1.6 * hash2(cell + 3.0);",
          "    float d = length(p - c);",
          "    g -= 0.09 * clamp((rad + 0.6 - d) / (1.2 * px), 0.0, 1.0);",
          "    g += 0.05 * clamp((rad + 0.6 - length(p - c - vec2(0.9, 1.1))) / (1.2 * px), 0.0, 1.0) * step(rad, d);",
          "  }",
          // the crack network: a warped cell pattern's edges, only where a slow noise allows
          "  vec2 w = p / 210.0 + 0.55 * vec2(fbm(p / 260.0), fbm(p / 260.0 + 7.3));",
          "  float e = cellEdge(w) * 210.0;",
          "  float where = smoothstep(0.5, 0.62, fbm(p / 520.0 + 21.0));",
          "  float crack = clamp((1.3 - e) / (1.1 * px), 0.0, 1.0) * where;",
          "  float crackRim = clamp((4.0 - e) / (2.0 * px), 0.0, 1.0) * where;",
          "  g *= 1.0 - 0.12 * crackRim;",
          "  g *= 1.0 - 0.75 * crack;",
          "  vec3 col = vec3(g) * vec3(0.93, 0.955, 1.0);",
          // the marks: r impact cracks, g the grooves' shade, b their lit lip
          "  vec4 mk = texture2D(marks, uv);",
          "  col *= 1.0 - 0.8 * mk.r;",
          "  col *= 1.0 - 0.72 * mk.g;",
          "  col += vec3(0.16, 0.165, 0.17) * mk.b;",
          // the cables in their grooves
          "  vec4 cb = texture2D(cables, uv);",
          "  col = mix(col, cb.rgb, cb.a);",
          // the light from the middle, darker toward the edges and corners
          "  vec2 q = (p - vec2(960.0, 540.0)) / vec2(960.0, 540.0);",
          "  float r = length((p - vec2(960.0, 540.0)) / 1.0);",
          "  float light = 0.3 + 0.95 * exp(-r * r / (500.0 * 500.0)) + 0.18 * exp(-r / 900.0);",
          "  light *= 1.0 - 0.35 * smoothstep(0.55, 1.45, length(q));",
          "  gl_FragColor = vec4(clamp(col * light, 0.0, 1.0), 1.0);",
          "}",
        ].join("\n");

        // 2. Each frame: the wall, shaken, brightened by the speaker's light and tinted by its glow.
        var BG_FS = [
          "uniform sampler2D wall;",
          "uniform vec2 shake;",
          "uniform vec3 glowCol;",
          "uniform float light, glow, rim;",
          "varying vec2 vUv;",
          "void main(){",
          "  vec2 p = vec2(vUv.x * 1920.0, (1.0 - vUv.y) * 1080.0) - shake;",
          "  vec3 col = texture2D(wall, vec2(p.x / 1920.0, 1.0 - p.y / 1080.0)).rgb;",
          "  float r = length(p - vec2(960.0, 540.0));",
          "  float near = exp(-r * r / (470.0 * 470.0));",
          "  float ring = exp(-max(r - rim, 0.0) / 110.0);",
          "  col *= 1.0 + (light - 1.0) * near + glowCol * glow * 1.1 * ring;",
          "  col += glowCol * glow * 0.035 * exp(-max(r - rim, 0.0) / 200.0);",
          "  gl_FragColor = vec4(col, 1.0);",
          "}",
        ].join("\n");

        // 3. The arcs, sparks and debris streaks: soft-edged lines in 1080p pixels, added on.
        var LINE_VS = [
          "attribute float edge;",
          "attribute float sharp;",
          "attribute vec3 tint;",
          "varying float vEdge;",
          "varying float vSharp;",
          "varying vec3 vTint;",
          "void main(){",
          "  vEdge = edge; vSharp = sharp; vTint = tint;",
          "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
          "}",
        ].join("\n");
        var LINE_FS = [
          "varying float vEdge;",
          "varying float vSharp;",
          "varying vec3 vTint;",
          "void main(){",
          "  float d = clamp(abs(vEdge), 0.0, 1.0);",
          "  float prof = pow(max(1.0 - d, 0.0), vSharp);",
          "  gl_FragColor = vec4(vTint * prof, 1.0);",
          "}",
        ].join("\n");

        /** A soft round glow texture (drawn once, the same every time). */
        function glowTexture() {
          var c = document.createElement("canvas");
          c.width = c.height = 64;
          var g = c.getContext("2d");
          var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
          grad.addColorStop(0, "rgba(255,255,255,1)");
          grad.addColorStop(0.3, "rgba(255,255,255,0.35)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, 64, 64);
          return new THREE.CanvasTexture(c);
        }
        /** A soft ring of light: brightest at RING_AT of the radius. */
        var RING_AT = 0.62;
        function ringTexture() {
          var c = document.createElement("canvas");
          c.width = c.height = 256;
          var g = c.getContext("2d");
          var grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
          grad.addColorStop(0, "rgba(255,255,255,0)");
          grad.addColorStop(RING_AT - 0.08, "rgba(255,255,255,0.05)");
          grad.addColorStop(RING_AT - 0.012, "rgba(255,255,255,0.9)");
          grad.addColorStop(RING_AT + 0.02, "rgba(255,255,255,0.75)");
          grad.addColorStop(RING_AT + 0.1, "rgba(255,255,255,0.22)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, 256, 256);
          return new THREE.CanvasTexture(c);
        }

        /** Each voxel face: full brightness, darker at its edges (the voxel seams). */
        function seamTexture() {
          var c = document.createElement("canvas");
          c.width = c.height = 32;
          var g = c.getContext("2d");
          g.fillStyle = "rgb(140,140,140)";
          g.fillRect(0, 0, 32, 32);
          g.fillStyle = "rgb(205,205,205)";
          g.fillRect(2, 2, 28, 28);
          g.fillStyle = "rgb(255,255,255)";
          g.fillRect(4, 4, 24, 24);
          return new THREE.CanvasTexture(c);
        }

        /** A polyline as a canvas path. */
        function tracePath(g, pts, dx, dy) {
          g.beginPath();
          g.moveTo(pts[0][0] + dx, pts[0][1] + dy);
          for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0] + dx, pts[i][1] + dy);
        }
        /** A cable's path, starting a little inside its plug (so no gap shows at the plug). */
        function cableLine(c) {
          var pts = CABLES[c];
          var dx = pts[1][0] - pts[0][0],
            dy = pts[1][1] - pts[0][1];
          var l = Math.hypot(dx, dy) || 1;
          return [[pts[0][0] - (dx / l) * 26, pts[0][1] - (dy / l) * 26]].concat(pts);
        }

        /**
         * The wall's marks, the same every time: in red the speaker's impact cracks (seeded
         * lightning reaching out from the rim, with forks), in green the cables' grooves (soft
         * shade), in blue the grooves' lit lip.
         */
        function drawMarks(c) {
          var g = c.getContext("2d");
          g.fillStyle = "#000";
          g.fillRect(0, 0, c.width, c.height);
          g.globalCompositeOperation = "lighter";
          g.lineCap = "round";
          g.lineJoin = "round";
          // the grooves
          for (var k = 0; k < 4; k++) {
            var line = cableLine(k);
            g.shadowColor = "rgb(0,255,0)";
            g.shadowBlur = 16;
            g.strokeStyle = "rgba(0,200,0,1)";
            g.lineWidth = GROOVE_W;
            tracePath(g, line, 0, 0);
            g.stroke();
            g.shadowBlur = 3;
            g.shadowColor = "rgb(0,0,255)";
            g.strokeStyle = "rgba(0,0,255,0.8)";
            g.lineWidth = 3;
            tracePath(g, line, 6, 7);
            g.stroke();
          }
          g.shadowBlur = 0;
          g.shadowColor = "transparent";
          // the impact cracks
          var rng = V.mulberry32(M.SEED + 11);
          for (var i = 0; i < 11; i++) {
            var a = ((i + 0.3 + 0.5 * rng()) / 11) * 2 * Math.PI;
            var r0 = M.RIM_PX + 2;
            var len = 130 + 330 * rng();
            var x0 = CX + Math.cos(a) * r0,
              y0 = CY + Math.sin(a) * r0;
            var bolt = V.lightningPath(
              x0,
              y0,
              x0 + Math.cos(a) * len,
              y0 + Math.sin(a) * len,
              M.SEED + 300 + i,
              6,
              0.16,
            );
            var forks = V.lightningBranches(
              bolt,
              M.SEED + 400 + i,
              1 + Math.floor(rng() * 3),
              4,
              0.2,
            );
            [bolt].concat(forks).forEach(function (pts, f) {
              for (var s = 1; s < pts.length; s++) {
                var along = s / pts.length;
                g.strokeStyle = "rgba(255,0,0," + (0.95 - 0.4 * along).toFixed(3) + ")";
                g.lineWidth = (f === 0 ? 3.2 : 2) * (1 - 0.7 * along) + 0.7;
                g.beginPath();
                g.moveTo(pts[s - 1][0], pts[s - 1][1]);
                g.lineTo(pts[s][0], pts[s][1]);
                g.stroke();
              }
            });
          }
          g.globalCompositeOperation = "source-over";
        }

        /** The four black rubber cables, lit from the upper left, with their shadows. */
        function drawCables(c) {
          var g = c.getContext("2d");
          g.clearRect(0, 0, c.width, c.height);
          g.lineCap = "round";
          g.lineJoin = "round";
          for (var k = 0; k < 4; k++) {
            var line = cableLine(k);
            // the cast shadow in the groove
            g.shadowColor = "rgba(0,0,0,0.85)";
            g.shadowBlur = 10;
            g.shadowOffsetX = 5;
            g.shadowOffsetY = 7;
            g.strokeStyle = "#060708";

            overCam.right = 1920 - shake[0];

              if (!(lens[s] > 7)) continue;
              var rp = V.ringPoint(ANGLES[s], "circle");
              var r0 = M.RIM_PX + 1;
              var sp = V.lightningPath(
                CX + rp[0] * r0,
                CY + rp[1] * r0,
                CX + rp[0] * (r0 + lens[s]),
                CY + rp[1] * (r0 + lens[s]),
                M.SEED + tick * 53 + s,
                3,
                0.3,
              );
              bolt(sp, 0.45 + (0.55 * lens[s]) / SPARK_MAX, 0.75);
            }
            // a strong hit: a bright arc jumps from a cable across to the rim, forking
            var strike = M.hitArc(events, tick, V.mulberry32);
            if (strike) {
              var ends = M.strikeEnds(CABLES[strike.cable], strike);
              var from = ends.from,
                to = ends.to;
              var main = V.lightningPath(from[0], from[1], to[0], to[1], strike.seed, 6, 0.2);
              bolt(main, strike.bright * 1.2, 2.2);
              var forks = V.lightningBranches(main, strike.seed, 3, 4, 0.25);
              for (var f = 0; f < forks.length; f++) bolt(forks[f], strike.bright * 0.8, 1.1);
            }
            // the debris: bright streaks, and chips of concrete
            var specks = M.debris(events, INT, DEBRIS_ON, V.mulberry32);
            var nChips = 0;
            for (var d = 0; d < specks.length; d++) {
              var p = specks[d];
              if (p.kind === "streak") {
                var tail = [
                  [p.x - p.dx * p.len, p.y - p.dy * p.len],
                  [p.x, p.y],
                ];
                ribbon(tail, 12, 2.2, scale3(GLOW_RGB, 0.6 * p.alpha));
                ribbon(tail, Math.max(3, 1.3 / SCALE), 0.6, scale3(CORE_RGB, p.alpha));
              } else {
                var sz = (p.size / M.VOXEL_PX) * (0.35 + 0.65 * p.alpha);
                chipP.set((p.x - CX) / M.VOXEL_PX, (CY - p.y) / M.VOXEL_PX, CHIP_Z);
                chipQ.setFromAxisAngle(chipAxis, p.spin);
                chipS.set(sz, sz, sz);
                chips.setMatrixAt(nChips++, chipM.compose(chipP, chipQ, chipS));
              }
            }
            chips.count = nChips;
            chips.instanceMatrix.needsUpdate = true;
            posAttr.needsUpdate = true;
            edgeAttr.needsUpdate = true;
            sharpAttr.needsUpdate = true;
            tintAttr.needsUpdate = true;
            posAttr.clearUpdateRanges();
            posAttr.addUpdateRange(0, nVerts * 3);
            edgeAttr.clearUpdateRanges();
            edgeAttr.addUpdateRange(0, nVerts);
            sharpAttr.clearUpdateRanges();
            sharpAttr.addUpdateRange(0, nVerts);
            tintAttr.clearUpdateRanges();
            tintAttr.addUpdateRange(0, nVerts * 3);
            lineGeo.setDrawRange(0, nVerts);

            renderer.setRenderTarget(null);
            renderer.clear();
            renderer.render(scene, camera);
            renderer.render(overlay, overCam);
          }
          function textChanged() {
            drawText();
            textTex.needsUpdate = true;
          }
          function dispose() {
            for (var i = disposables.length - 1; i >= 0; i--) disposables[i].dispose();
            renderer.dispose();
          }
          return {
            render: render,
            dispose: dispose,
            apply: apply,
            resize: resize,
            textChanged: textChanged,
          };
        }

        function fail(error) {
          V.showError(String((error && error.message) || error));
        }
        var drawing = null; // { render(t), dispose(), apply(), resize(scale), textChanged() }
        var lastTime = -1;
        function draw(t) {
          if (!drawing) return;
          try {
            drawing.render(t);
            lastTime = t;
          } catch (error) {
            drawing = null;
            fail(error);
          }
        }
        try {
          drawing = setup();
        } catch (error) {
          fail(error);
        }
        draw(0);
        // The text is drawn on a canvas: draw it again whenever a font arrives.
        function fontsChanged() {
          if (drawing) drawing.textChanged();
          draw(Math.max(0, lastTime));
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fontsChanged);
        if (document.fonts && document.fonts.addEventListener) {
          document.fonts.addEventListener("loadingdone", fontsChanged);
        }
        window.addEventListener("hf-seek", function (e) {
          draw(e.detail.time);
        });

        // Live preview (the editor): new settings or a new preview resolution arrive as
        // runtime data. Renders never send any, so they look exactly as without this.
        var hf = window.__hyperframes;
        if (hf && hf.registerRuntimeDataHandler) {
          hf.registerRuntimeDataHandler("settings", function (values) {
            if (!values || typeof values !== "object") return;
            for (var key in values) if (key in DEFAULTS) vars[key] = values[key];
            if (drawing) drawing.apply();
            draw(Math.max(0, lastTime));
          });
          hf.registerRuntimeDataHandler("preview", function (data) {
            var scale = Number(data && data.scale);
            if (!(scale > 0 && scale <= 1) || scale === PREVIEW_SCALE) return;
            PREVIEW_SCALE = scale;
            if (drawing) drawing.resize(scale);
            draw(Math.max(0, lastTime));
          });
        }

        // The whole picture fades to black over the song's last 2.5 s.
        var tl = gsap.timeline({ paused: true });
        tl.to(
          "#fade",
          { opacity: 1, duration: 2.5, ease: "power1.in" },
          Math.max(0, DURATION - 2.5),
        );
        // While the preview plays, the runtime advances this timeline (hf-seek only comes on
        // jumps), so draw on every timeline update too.
        tl.eventCallback("onUpdate", function () {
          var t = tl.time();
          if (t !== lastTime) draw(t);
        });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
