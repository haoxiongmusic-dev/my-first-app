<!doctype html>
<!--
  Late Show: a close-up of an old television, built from voxels, showing a synthwave scene. The
  thick grey plastic bezel (and a sliver of the darker cabinet) frames a bulging screen with
  scanlines, a vignette and a pale window-shaped glare. On the screen: a neon grid floor rushing
  toward you, a very bright horizon line, low dark mountains, a starry sky, a striped sun, a thin
  spectrum line on the horizon (the bass at both ends), your cover standing on the horizon
  (glitching on strong beats), the title above it in slanted chrome, the tagline below.
  Spec: docs/superpowers/specs/2026-11-10-m9-final-templates-design.md §5.3

  Built with three.js, following Prism Heart's rules: colour management off, no tone mapping and
  linear output (preset colours come out exactly as picked), every render target 8-bit (half
  float renders blank on this PC), the renderer built once (settings only update materials).
    1. The scene on the screen: one full-screen shader drawn into its own 8-bit target. The title
       and tagline are drawn once (on settings and font changes) on a 2D canvas it reads.
    2. The TV: the voxel bezel, cabinet and power light (assets/tv-voxels.js) as instanced cubes
       a little smaller than the grid (the gaps read as voxel seams), lit by a window light from
       the top left and by the screen's own glow. The screen is a curved mesh in the bezel's
       opening that shows the scene through the CRT look: barrel curve, scanlines, vignette,
       glare (all scaled by the CRT effect setting), flicker, dips and a roll line on strong hits.

  Song inputs (fixed paths, placed by the job builder): assets/song.wav, assets/audio-data.js.
  The committed root duration (20 s) matches the generated sample song; the job builder sets
  every data-song-length element to the real song's length. The motion maths lives in
  assets/show-motion.js (unit-tested).

  The cover arrives as a picture location (assets/images/cover.jpg in an export, the image
  route in the preview) or "": no cover shows the striped sun alone.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"SONG NAME","maxLength":60},
    {"id":"tagline","type":"string","label":"Tagline","default":"SYNTHWAVE FOREVER","maxLength":40},
    {"id":"font","type":"enum","label":"Font","default":"Orbitron","options":[
      {"value":"Orbitron","label":"Orbitron"},
      {"value":"Montserrat","label":"Montserrat"},
      {"value":"Inter","label":"Inter"},
      {"value":"Outfit","label":"Outfit"},
      {"value":"Poppins","label":"Poppins"},
      {"value":"Lato","label":"Lato"},
      {"value":"Oswald","label":"Oswald"},
      {"value":"Playfair Display","label":"Playfair Display"},
      {"value":"EB Garamond","label":"EB Garamond"}]},
    {"id":"cover","type":"image","label":"Cover art","default":"","fit":"square"},
    {"id":"mainColor","type":"color","label":"Main color","default":"#ff2fd0"},
    {"id":"accentColor","type":"color","label":"Accent color","default":"#2fe8ff"},
    {"id":"intensity","type":"number","label":"Intensity","default":1,"min":0.2,"max":2,"step":0.1},
    {"id":"crtEffect","type":"number","label":"CRT effect","default":70,"min":0,"max":100,"step":1,"unit":"%"},
    {"id":"beatRange","type":"enum","label":"Beat range","default":"kick","options":[
      {"value":"kick","label":"Kick (auto)"},
      {"value":"20-90","label":"20–90 Hz"},
      {"value":"90-200","label":"90–200 Hz"},
      {"value":"20-200","label":"20–200 Hz"},
      {"value":"200-600","label":"200–600 Hz"},
      {"value":"600-3000","label":"600–3000 Hz"},
      {"value":"3000-8000","label":"3000–8000 Hz"},
      {"value":"8000-20000","label":"8000–20000 Hz"},
      {"value":"20-20000","label":"20–20000 Hz"}]},
    {"id":"spectrumLow","type":"number","label":"Spectrum low","default":30,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumHigh","type":"number","label":"Spectrum high","default":1000,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumBoost","type":"enum","label":"Spectrum boost","default":"8","options":[
      {"value":"1","label":"1×"},
      {"value":"2","label":"2×"},
      {"value":"4","label":"4×"},
      {"value":"8","label":"8×"}]},
    {"id":"bandCount","type":"number","label":"Bands","default":100,"min":10,"max":100,"step":1,"unit":"%"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/audio-data.js"></script>
    <script src="assets/viz-toolkit.js"></script>
    <script src="assets/three-kit.js"></script>
    <script src="assets/tv-voxels.js"></script>
    <script src="assets/show-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Orbitron";
        font-weight: 400;
        src: url("assets/fonts/orbitron-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Orbitron";
        font-weight: 700;
        src: url("assets/fonts/orbitron-700.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;

        background: #000;

        width: 1920px;
        height: 1080px;

      }
      /* Mentioning every font family lets HyperFrames bundle them all for the Font setting. */

        font-family: "Orbitron";
      }

        font-family: "Montserrat";
      }
      .f-inter {
        font-family: "Inter";
      }
      .f-outfit {
        font-family: "Outfit";
      }
      .f-poppins {
        font-family: "Poppins";
      }
      .f-lato {
        font-family: "Lato";
      }
      .f-oswald {

      }
      .f-playfair {

      }
      .f-garamond {

      }
      #fontPreload b {
        font-weight: 700;
      }

        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="viz" width="1920" height="1080"></canvas>
      <div
        id="fade"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="2"
      ></div>
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="1"
        data-volume="1"
        src="assets/song.wav"
      ></audio>
    </div>
    <img id="coverImg" alt="" />
    <div id="fontPreload" aria-hidden="true">
      <span class="f-orbitron">Aa<b>Aa</b></span
      ><span class="f-montserrat">Aa<b>Aa</b></span
      ><span class="f-inter">Aa<b>Aa</b></span> <span class="f-outfit">Aa<b>Aa</b></span
      ><span class="f-poppins">Aa<b>Aa</b></span> <span class="f-lato">Aa<b>Aa</b></span
      ><span class="f-oswald">Aa<b>Aa</b></span> <span class="f-playfair">Aa<b>Aa</b></span
      ><span class="f-garamond">Aa<b>Aa</b></span>
    </div>
    <script>
      (function () {
        var V = window.VizToolkit;
        var K = window.THREE_KIT;
        var THREE = K.THREE;
        var M = window.ShowMotion;
        var TV = window.LateShowTV;
        // Colours are plain display values, as in the other WebGL templates.
        THREE.ColorManagement.enabled = false;
        // Settings: the template's own declared defaults, overridden by the values HyperFrames
        // passes in (render) and, in the editor's live preview, by runtime-data messages.
        var DEFAULTS = V.declaredDefaults(
          document.documentElement.getAttribute("data-composition-variables"),
        );
        var given =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var vars = {};
        for (var id in DEFAULTS) vars[id] = DEFAULTS[id];
        for (var key in given)
          if (given[key] !== undefined && given[key] !== null) vars[key] = given[key];
        function setting(id) {
          return vars[id];
        }
        // Drawing resolution: always full size, except in the editor's preview (runtime data).
        var PREVIEW_SCALE = 1;
        var DURATION =
          parseFloat(document.getElementById("root").getAttribute("data-duration")) || 20;

        // ---------- the screen's layout (1080p pixels of the scene, y down) ----------
        var HORIZON = 590;
        var COVER = { x: 825, y: 320, size: 270 }; // standing on the horizon, centred
        var SUN = { x: 960, y: 445, r: 200 };
        var TITLE = { top: 34, bottom: 232, width: 1280 };
        var TAGLINE = { y: 664, size: 30, width: 1000 };
        var SPEC = { x0: 150, x1: 1770, texels: 256 };
        var BEAT_RELEASE = 0.3; // the sun's breathing and the beat's share of the brightness
        var SCENE_RES = 0.8; // the scene's drawing size, as a share of the frame's
        var SPEC_LINE = 2.2; // px: the spectrum and horizon lines' core width at full size

        // ---------- the TV (voxel units; the screen's opening is 119 × 67) ----------
        var VOXEL = 0.95; // cube size; the gaps read as voxel seams
        var CAM_FOV = 30;
        var VIEW_HALF_H = 40.2; // half the frame's height at the bezel's face (its lip just outside)
        var CAM_DIST = VIEW_HALF_H / Math.tan(((CAM_FOV / 2) * Math.PI) / 180);
        var BULGE = 3.4; // how far the screen's glass bulges forward at its centre

        /** [r, g, b] 0..1 mixes. */
        function mix(a, b, f) {
          return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
        }
        function scale3(a, k) {
          return [a[0] * k, a[1] * k, a[2] * k];
        }
        function add3(a, b) {
          return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
        }
        function css(rgb, alpha) {
          return (
            "rgba(" +
            Math.round(Math.max(0, Math.min(1, rgb[0])) * 255) +
            "," +
            Math.round(Math.max(0, Math.min(1, rgb[1])) * 255) +
            "," +
            Math.round(Math.max(0, Math.min(1, rgb[2])) * 255) +
            "," +
            alpha +
            ")"
          );
        }

        // ---------- the cover picture ----------
        // The location is set at once, so the page's own loading waits for it; the frame is
        // drawn again when it arrives. A picture that fails to load is simply left out.
        var coverImg = document.getElementById("coverImg");
        var coverSrc = "";
        var coverLoaded = false;
        var onCover = null; // set by setup(): uploads the picture
        coverImg.addEventListener("load", function () {
          coverLoaded = true;
          if (onCover) onCover();
          draw(Math.max(0, lastTime));
        });
        coverImg.addEventListener("error", function () {
          coverLoaded = false;
          if (onCover) onCover();
          draw(Math.max(0, lastTime));
        });
        function setCover(value) {
          // HyperFrames hands an image setting over as text; accept { url } as well.
          var src = value && typeof value === "object" ? value.url || "" : value || "";
          if (src === coverSrc) return;
          coverSrc = src;
          coverLoaded = false;
          if (onCover) onCover();
          if (src) coverImg.src = src;
          else coverImg.removeAttribute("src");
        }
        setCover(setting("cover"));

        // ---------- the title and tagline, drawn on a 2D canvas the screen shader reads ----------
        var textCanvas = document.createElement("canvas");
        textCanvas.width = 1920;
        textCanvas.height = 1080;
        var tctx = textCanvas.getContext("2d");

        /** The title's face: the reference's chrome, yellow on top to red-orange below. */
        function titleFace(ctx, size) {
          var g = ctx.createLinearGradient(0, -0.42 * size, 0, 0.42 * size);
          g.addColorStop(0, "#fff5ad");
          g.addColorStop(0.36, "#ffd04a");
          g.addColorStop(0.5, "#ffa632");
          g.addColorStop(0.53, "#ff6a2a");
          g.addColorStop(1, "#ff2c3c");
          return g;
        }

        function drawText() {
          var ctx = tctx;
          var font = '"' + setting("font") + '", sans-serif';
          var main = V.hexToRGB(setting("mainColor"));
          var acc = V.hexToRGB(setting("accentColor"));
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, 1920, 1080);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

          // the title: as big as fits on one line, else two lines, shrinking as needed
          var title = String(setting("title") || "").toUpperCase();
          var measure = function (s) {
            ctx.font = "700 100px " + font;
            return ctx.measureText(s).width / 100;
          };
          var fit = M.fitTitle(title, measure, TITLE.width, 1, 150, 76);
          if (fit.lines.length > 1) fit = M.fitTitle(title, measure, TITLE.width, 2, 88, 30);
          var size = fit.size;
          var lines = fit.lines;
          var lineH = size * 1.02;
          var depth = Math.max(4, Math.round(size * 0.11)); // the extruded side, px
          var boxH = TITLE.bottom - TITLE.top;
          var blockH = lines.length * lineH + depth;
          // last resort (a word too long even when broken): scale the whole block down
          var widest = 0;
          for (var w = 0; w < lines.length; w++)
            widest = Math.max(widest, measure(lines[w]) * size);
          var k = Math.min(1, boxH / Math.max(blockH, 1), TITLE.width / Math.max(widest, 1));
          var cy = (TITLE.top + TITLE.bottom) / 2 - (depth * k) / 2;
          ctx.font = "700 " + size + "px " + font;
          ctx.lineJoin = "round";
          for (var i = 0; i < lines.length; i++) {
            var ly = cy + (i - (lines.length - 1) / 2) * lineH * k;
            // slanted forward (an italic skew about the line's centre)
            ctx.setTransform(k, 0, -0.2 * k, k, 960, ly);
            // a coloured glow behind it all
            ctx.shadowColor = css(main, 0.85);
            ctx.shadowBlur = 36 * k;
            ctx.fillStyle = css(scale3(main, 0.5), 1);
            ctx.fillText(lines[i], 0, depth / 2);
            ctx.shadowBlur = 0;
            ctx.shadowColor = "transparent";
            // the extruded side, going down and back: dark nearest the back
            for (var d = depth; d >= 1; d--) {
              var f = d / depth;
              ctx.fillStyle = css(mix(scale3(main, 0.55), [0.05, 0.0, 0.08], f * 0.85), 1);
              ctx.fillText(lines[i], 0, d);
            }
            // a dark outline, then the chrome face and a thin bright rim on top
            ctx.strokeStyle = "rgba(20, 2, 26, 0.9)";
            ctx.lineWidth = Math.max(2, size * 0.035);
            ctx.strokeText(lines[i], 0, 0);
            ctx.fillStyle = titleFace(ctx, size);
            ctx.fillText(lines[i], 0, 0);
            ctx.strokeStyle = "rgba(255, 255, 240, 0.55)";
            ctx.lineWidth = Math.max(1, size * 0.012);
            ctx.strokeText(lines[i], 0, 0);
          }
          ctx.setTransform(1, 0, 0, 1, 0, 0);

          // the tagline: small spaced capitals under the horizon, in the accent colour's glow
          var tag = String(setting("tagline") || "")
            .toUpperCase()
            .trim();
          if (tag) {
            var tsize = TAGLINE.size;
            var spacing = 0.42;
            var tw = function (s) {
              ctx.font = "400 " + s + "px " + font;
              if ("letterSpacing" in ctx) ctx.letterSpacing = (spacing * s).toFixed(1) + "px";
              return ctx.measureText(tag).width;
            };
            while (tw(tsize) > TAGLINE.width && tsize > 12) tsize -= 1;
            var squeeze = Math.min(1, TAGLINE.width / Math.max(tw(tsize), 1));
            ctx.setTransform(squeeze, 0, 0, 1, 960 + (spacing * tsize) / 2, TAGLINE.y);
            ctx.shadowColor = css(acc, 0.9);
            ctx.shadowBlur = 14;
            ctx.fillStyle = css(mix(acc, [1, 1, 1], 0.7), 0.95);
            ctx.fillText(tag, 0, 0);
            ctx.shadowBlur = 0;
            ctx.shadowColor = "transparent";
            ctx.setTransform(1, 0, 0, 1, 0, 0);
          }
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        // ---------- shaders ----------
        var QUAD_VS = [
          "varying vec2 vUv;",
          "void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        ].join("\n");
        // 1. The synthwave scene, in 1080p pixels of the screen (y down): sky with stars, the
        // striped sun, two mountain ridges, the spectrum line and the horizon, the grid floor
        // (lines thin out into a glow where they crowd), the cover standing on the horizon with
        // its reflection, and the title and tagline from the text canvas on top.
        var SCENE_FS = [
          "uniform vec3 mainCol, accCol, skyTop, skyMid, sunTop, sunBot, floorCol, ridgeCol;",
          "uniform float travel, lvGrid, lvHorizon, lvGlow, lvSun, lineW, lineGain, px;",
          "uniform vec2 gaps[7];",
          "uniform sampler2D specTex, coverTex, textTex;",
          "uniform float hasCover, glitchOn, split;",
          "uniform vec3 slices[4];",
          "uniform float horizon, specX0, specX1, specMax;",
          "uniform vec3 sun, cover;",
          "varying vec2 vUv;",
          "float hash1(float n){ return fract(sin(mod(n, 256.0) * 91.3458) * 47453.5453); }",
          "float hash2(vec2 p){ return fract(sin(dot(mod(p, 256.0), vec2(12.9898, 78.233))) * 43758.5453); }",
          "float vnoise(float x){",
          "  float i = floor(x); float f = fract(x); f = f * f * (3.0 - 2.0 * f);",
          "  return mix(hash1(i), hash1(i + 1.0), f);",
          "}",
          // a ridge's height above the horizon: low in the middle, taller toward the sides
          "float ridge(float x, float seed, float maxH){",
          "  float n = 0.65 * vnoise(x / 150.0 + seed) + 0.35 * vnoise(x / 47.0 + seed * 3.1);",
          "  float side = clamp((abs(x - 960.0) - 150.0) / 620.0, 0.0, 1.0);",
          "  side = side * side * (3.0 - 2.0 * side);",
          "  return maxH * (0.12 + 0.88 * side) * (0.4 + 0.6 * n);",
          "}",
          // a crisp line of width w (px) at distance d (px), anti-aliased over one pixel
          "float core(float d, float w){ return clamp((0.5 * w - d) / px + 0.5, 0.0, 1.0); }",
          "void main(){",
          "  vec2 p = vec2(vUv.x * 1920.0, (1.0 - vUv.y) * 1080.0);",
          "  vec3 col;",
          "  float above = horizon - p.y;",
          "  if (above > 0.0) {",
          "    float t = clamp(p.y / horizon, 0.0, 1.0);",
          "    col = mix(skyTop, skyMid, t * t);",
          "    col += mainCol * lvGlow * (0.42 * exp(-above / 70.0) + 0.14 * exp(-above / 260.0));",
          // stars: one in some 26 px cells, fading toward the horizon glow
          "    vec2 cell = floor(p / 26.0);",
          "    float r = hash2(cell);",
          "    if (r > 0.86) {",
          "      vec2 sp = (cell + vec2(0.15) + 0.7 * vec2(hash2(cell + 17.0), hash2(cell + 41.0))) * 26.0;",
          "      float b = (r - 0.86) / 0.14;",
          "      float sd = length(p - sp);",
          "      col += vec3(0.86, 0.82, 1.0) * clamp((1.0 + 0.6 * b - sd) / px, 0.0, 1.0) * (0.25 + 0.75 * b) * (1.0 - 0.9 * t);",
          "    }",
          // the sun, cut by its gaps in the lower half, with a soft halo
          "    float sdist = length(p - sun.xy);",
          "    float sunA = clamp((sun.z - sdist) / px + 0.5, 0.0, 1.0);",
          "    for (int i = 0; i < 7; i++) {",
          "      vec2 g = gaps[i];",
          "      if (g.y > g.x) {",
          "        float y0 = sun.y + g.x * sun.z;",
          "        float y1 = sun.y + g.y * sun.z;",
          "        sunA *= 1.0 - clamp(min(p.y - y0, y1 - p.y) / px + 0.5, 0.0, 1.0);",
          "      }",
          "    }",
          "    float sv = clamp((p.y - (sun.y - sun.z)) / (1.25 * sun.z), 0.0, 1.0);",
          "    vec3 sunC = mix(sunTop, sunBot, sv) * lvSun;",
          "    col += sunBot * lvSun * 0.2 * exp(-max(sdist - sun.z, 0.0) / 60.0);",
          "    col = mix(col, sunC, sunA);",
          // two ridges of low dark mountains, each with a rim of light along its top
          "    float far = ridge(p.x, 3.0, 120.0);",
          "    if (above < far) {",
          "      col = ridgeCol * 1.6 + mainCol * lvGlow * (0.5 * exp(-(far - above) / 2.2) + 0.08 * exp(-above / 30.0));",
          "    }",
          "    float near = ridge(p.x + 517.0, 11.0, 78.0);",
          "    if (above < near) {",
          "      col = ridgeCol + mainCol * lvGlow * (0.4 * exp(-(near - above) / 2.0) + 0.1 * exp(-above / 18.0));",
          "    }",
          // the spectrum line on the horizon (the bass at both ends)
          "    if (p.x > specX0 && p.x < specX1) {",
          "      float u = (p.x - specX0) / (specX1 - specX0);",
          "      float du = 2.0 / (specX1 - specX0);",
          "      float h0 = texture2D(specTex, vec2(u, 0.5)).r * specMax;",
          "      float hA = texture2D(specTex, vec2(u - du, 0.5)).r * specMax;",
          "      float hB = texture2D(specTex, vec2(u + du, 0.5)).r * specMax;",
          "      float slope = (hB - hA) / 4.0;",
          "      float d = abs(above - h0) / sqrt(1.0 + slope * slope);",
          "      float amp = smoothstep(0.5, 5.0, h0);",
          "      col += accCol * 0.07 * amp * step(above, h0);",
          "      col += (mix(accCol, vec3(1.0), 0.45) * core(d, lineW) * lineGain + accCol * exp(-d / 5.0) * 0.4) * amp;",
          "    }",
          "  } else {",
          // the floor: a perspective grid scrolling toward the viewer
          "    float dy = max(-above, 0.5);",
          "    col = floorCol + mainCol * lvGlow * 0.32 * exp(-dy / 45.0);",
          // the cover's reflection, fading down from the horizon
          "    if (hasCover > 0.5) {",
          "      vec2 rq = vec2((p.x - cover.x) / cover.z, (2.0 * horizon - p.y - cover.y) / cover.z);",
          "      if (rq.x >= 0.0 && rq.x <= 1.0 && rq.y >= 0.0 && rq.y <= 1.0) {",
          "        float fade = clamp(1.0 - dy / (0.45 * cover.z), 0.0, 1.0);",
          "        col += texture2D(coverTex, vec2(rq.x, 1.0 - rq.y)).rgb * 0.2 * fade * fade;",
          "      }",
          "    }",
          "    float fz = 3291.0 / dy + travel;",
          "    float fx = (p.x - 960.0) / dy * 4.36;",
          "    float wz = max(fwidth(fz), 1e-5);",
          "    float wx = max(fwidth(fx), 1e-5);",
          "    float dz = abs(fract(fz + 0.5) - 0.5) / wz;",
          "    float dx = abs(fract(fx + 0.5) - 0.5) / wx;",
          "    float lw = lineW / px;",
          "    float lz = clamp(0.5 * lw - dz + 0.5, 0.0, 1.0) * clamp(1.0 - (wz - 0.12) / 0.3, 0.0, 1.0);",
          "    float lx = clamp(0.5 * lw - dx + 0.5, 0.0, 1.0) * clamp(1.0 - (wx - 0.12) / 0.3, 0.0, 1.0);",
          "    float halo = exp(-dz * dz / 18.0) * step(wz, 0.4) + exp(-dx * dx / 18.0) * step(wx, 0.4);",
          // where lines crowd (far away) they become an even glow
          "    float crowd = clamp((wz - 0.12) / 0.3, 0.0, 1.0) * min(wz * lw, 1.0) * 0.28;",
          "    float grid = max(lz, lx) * lineGain + 0.22 * halo + crowd;",
          "    col += mainCol * lvGrid * grid * (0.55 + 0.45 * exp(-dy / 200.0));",
          "  }",
          // the horizon: a very bright line with a wide glow
          "  float dh = abs(above);",
          "  col += (mix(mainCol, vec3(1.0), 0.62) * core(dh, lineW * 1.3) * lineGain",
          "    + mainCol * (0.55 * exp(-dh / 9.0) + 0.22 * exp(-dh / 38.0))) * lvHorizon;",
          // the cover: standing on the horizon, glitching in slices on strong beats
          "  if (hasCover > 0.5) {",
          "    vec2 q = (p - cover.xy) / cover.z;",
          "    float shift = 0.0;",
          "    if (glitchOn > 0.5) {",
          "      for (int i = 0; i < 4; i++) {",
          "        if (q.y >= slices[i].x && q.y < slices[i].y) shift = slices[i].z;",
          "      }",
          "    }",
          "    vec2 cq = vec2(q.x - shift, q.y);",
          "    if (cq.x >= 0.0 && cq.x <= 1.0 && cq.y >= 0.0 && cq.y <= 1.0) {",
          "      vec2 tuv = vec2(cq.x, 1.0 - cq.y);",
          "      vec3 c = texture2D(coverTex, tuv).rgb;",
          "      if (shift != 0.0) {",
          "        c.r = texture2D(coverTex, tuv + vec2(split / cover.z, 0.0)).r;",
          "        c.b = texture2D(coverTex, tuv - vec2(split / cover.z, 0.0)).b;",
          "      }",
          "      float edge = min(min(cq.x, 1.0 - cq.x), min(cq.y, 1.0 - cq.y)) * cover.z;",
          "      col = mix(mix(accCol, vec3(1.0), 0.55), c, clamp((edge - 2.5) / px + 0.5, 0.0, 1.0));",
          "    } else {",
          "      vec2 o = max(max(cover.xy - p, p - cover.xy - vec2(cover.z)), 0.0);",
          "      if (p.y < horizon) col += mainCol * 0.3 * exp(-length(o) / 16.0);",
          "    }",
          "  }",
          // the title and tagline
          "  vec4 tx = texture2D(textTex, vUv);",
          "  col = mix(col, tx.rgb, tx.a);",
          "  gl_FragColor = vec4(max(col, 0.0), 1.0);",
          "}",
        ].join("\n");

        // 2. The screen: a curved mesh in the bezel's opening. vUv is the scene's position
        // (0..1 across the opening); the glass bulges forward toward its centre.
        var SCREEN_VS = [
          "uniform vec2 open; uniform float glassZ, bulge, half_w, half_h;",
          "varying vec2 vUv;",
          "void main(){",
          "  vec3 p = position;",
          "  float ex = p.x / half_w, ey = p.y / half_h;",
          "  p.z = glassZ + bulge * max(0.0, 1.0 - ex * ex) * max(0.0, 1.0 - ey * ey);",
          "  vUv = vec2(p.x / (2.0 * open.x) + 0.5, p.y / (2.0 * open.y) + 0.5);",
          "  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);",
          "}",
        ].join("\n");
        // The CRT look: barrel curve, scanlines, a vignette and the window glare (each scaled by
        // crt), a soft phosphor glow from the scene's smaller copies (mipmaps), the flicker and
        // hit dips (bright), the roll line, and the power-on at the start.
        var SCREEN_FS = [
          "uniform sampler2D sceneTex;",
          "uniform float crt, bright, rollPos, rollAlpha, power, glareShift;",
          "varying vec2 vUv;",
          "float rbox(vec2 p, vec2 b, float r){",
          "  vec2 q = abs(p) - b + r;",
          "  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;",
          "}",
          "void main(){",
          "  vec2 c = vUv - 0.5;",
          "  vec2 ca = c * vec2(1.0, 0.5625);",
          "  float r2 = dot(ca, ca);",
          "  float k = 0.2 * crt;",
          "  vec2 uv = 0.5 + c * (1.0 + k * r2) / (1.0 + 0.25 * k) * 1.012;",
          // power-on: the picture grows out of a bright line across the middle
          "  float open = power * power * (3.0 - 2.0 * power);",
          "  uv.y = 0.5 + (uv.y - 0.5) / max(open, 0.01);",
          // the roll line: a bright band sweeping down, nudging the picture sideways
          "  float rb = (vUv.y - (1.0 - rollPos)) / 0.035;",
          "  float roll = exp(-rb * rb) * rollAlpha;",
          "  float trail = exp(-(rb - 1.8) * (rb - 1.8) * 0.5) * rollAlpha;",
          "  uv.x += 0.009 * roll;",
          "  float edge = rbox(uv - 0.5, vec2(0.5), 0.035);",
          "  float mask = clamp(-edge / max(fwidth(edge), 1e-5) + 0.5, 0.0, 1.0);",
          "  vec3 col = texture2D(sceneTex, uv).rgb;",
          "  vec3 glow = texture2D(sceneTex, uv, 2.5).rgb * 0.55 + texture2D(sceneTex, uv, 4.5).rgb * 0.45;",
          "  col += glow * (0.18 + 0.2 * crt);",
          // scanlines: a soft wave, faded out where they'd crowd under two pixels apart
          "  float lines = 190.0;",
          "  float s = 0.5 + 0.5 * cos(6.2831853 * uv.y * lines);",
          "  float fw = fwidth(uv.y * lines);",
          "  col *= 1.0 - crt * 0.3 * s * clamp(1.6 - fw * 2.2, 0.0, 1.0);",
          "  float v = dot(ca, ca) * 4.0;",
          "  col *= 1.0 - crt * 0.55 * smoothstep(0.2, 1.3, v);",
          "  col *= bright * (1.0 + 0.45 * roll) * (1.0 - 0.3 * trail);",
          "  col += vec3(0.05, 0.05, 0.06) * roll;",
          "  float shown = clamp((0.5 * open + 0.004 - abs(vUv.y - 0.5)) / max(fwidth(vUv.y), 1e-5), 0.0, 1.0);",
          "  col = col * shown * (1.0 + 1.2 * (1.0 - open)) + vec3(0.35, 0.35, 0.4) * shown * (1.0 - open);",
          "  col *= mask;",
          // the glare: a pale four-pane window reflected on the glass, top left
          "  vec2 g = vUv + vec2(glareShift, 0.0);",
          "  float gx = (g.x - 0.05 - (g.y - 0.6) * 0.22) / 0.21;",
          "  float gy = (g.y - 0.6) / 0.33;",
          "  float win = smoothstep(0.0, 0.1, gx) * smoothstep(1.0, 0.86, gx) * smoothstep(0.0, 0.14, gy) * smoothstep(1.0, 0.88, gy);",
          "  float bars = smoothstep(0.018, 0.05, abs(gx - 0.52)) * smoothstep(0.018, 0.06, abs(gy - 0.5));",
          "  float sheen = exp(-dot(g - vec2(0.16, 0.86), g - vec2(0.16, 0.86)) * 9.0);",
          "  col += vec3(0.86, 0.9, 1.0) * crt * (0.085 * win * bars * (0.55 + 0.45 * gy) + 0.035 * sheen);",
          "  gl_FragColor = vec4(max(col, 0.0), 1.0);",
          "}",
        ].join("\n");

        /** A soft round glow texture (drawn once, the same every time). */
        function glowTexture() {
          var c = document.createElement("canvas");
          c.width = c.height = 64;
          var g = c.getContext("2d");
          var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
          grad.addColorStop(0, "rgba(255,255,255,1)");
          grad.addColorStop(0.3, "rgba(255,255,255,0.4)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, 64, 64);
          return new THREE.CanvasTexture(c);
        }

        /**
         * Build the renderer and the scene once. Settings changes only update materials, audio
         * and the text (apply), and a new preview size only resizes (resize), so the live
         * preview never piles up WebGL contexts.
         */
        function setup() {
          var canvas = document.getElementById("viz");
          var renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            preserveDrawingBuffer: true,
          });
          renderer.debug.onShaderError = function (gl, program, vs, fs) {
            throw new Error(
              "A three.js shader failed to compile: " +
                (gl.getShaderInfoLog(vs) || "") +
                (gl.getShaderInfoLog(fs) || "") +
                (gl.getProgramInfoLog(program) || ""),
            );
          };
          renderer.setPixelRatio(1);
          renderer.toneMapping = THREE.NoToneMapping;
          renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
          renderer.setClearColor(0x000000, 1);
          var disposables = [];
          function keep(thing) {
            disposables.push(thing);
            return thing;
          }

          // ----- 1. the scene on the screen, drawn into its own 8-bit target -----
          var sceneTarget = keep(
            new THREE.WebGLRenderTarget(1920, 1080, {
              type: THREE.UnsignedByteType,
              depthBuffer: false,
              generateMipmaps: true,
              minFilter: THREE.LinearMipmapLinearFilter,
              magFilter: THREE.LinearFilter,
            }),
          );
          var specData = new Uint8Array(SPEC.texels * 4);
          var specTex = keep(
            new THREE.DataTexture(
              specData,
              SPEC.texels,
              1,
              THREE.RGBAFormat,
              THREE.UnsignedByteType,
            ),
          );
          specTex.magFilter = THREE.LinearFilter;
          specTex.minFilter = THREE.LinearFilter;
          specTex.needsUpdate = true;
          var textTex = keep(new THREE.CanvasTexture(textCanvas));
          textTex.minFilter = THREE.LinearMipmapLinearFilter;
          var coverTex = keep(new THREE.Texture(coverImg));
          coverTex.minFilter = THREE.LinearFilter;
          coverTex.generateMipmaps = false;
          var gapValues = [];
          for (var gi = 0; gi < 7; gi++) gapValues.push(new THREE.Vector2(0, 0));
          var sliceValues = [];
          for (var si = 0; si < 4; si++) sliceValues.push(new THREE.Vector3(0, 0, 0));
          var quad = keep(new THREE.PlaneGeometry(2, 2));
          var sceneMat = keep(
            new THREE.ShaderMaterial({
              vertexShader: QUAD_VS,
              fragmentShader: SCENE_FS,
              uniforms: {
                mainCol: { value: new THREE.Color() },
                accCol: { value: new THREE.Color() },
                skyTop: { value: new THREE.Color() },
                skyMid: { value: new THREE.Color() },
                sunTop: { value: new THREE.Color() },
                sunBot: { value: new THREE.Color() },
                floorCol: { value: new THREE.Color() },
                ridgeCol: { value: new THREE.Color() },
                travel: { value: 0 },
                lvGrid: { value: 1 },
                lvHorizon: { value: 1 },
                lvGlow: { value: 1 },
                lvSun: { value: 1 },
                lineW: { value: SPEC_LINE },
                lineGain: { value: 1 },
                px: { value: 1 },
                gaps: { value: gapValues },
                specTex: { value: specTex },
                coverTex: { value: coverTex },
                textTex: { value: textTex },
                hasCover: { value: 0 },
                glitchOn: { value: 0 },
                split: { value: 0 },
                slices: { value: sliceValues },
                horizon: { value: HORIZON },
                specX0: { value: SPEC.x0 },
                specX1: { value: SPEC.x1 },
                specMax: { value: M.SPEC_MAX },
                sun: { value: new THREE.Vector3(SUN.x, SUN.y, SUN.r) },
                cover: { value: new THREE.Vector3(COVER.x, COVER.y, COVER.size) },
              },
              depthTest: false,
              depthWrite: false,
            }),
          );
          var sceneQuad = new THREE.Mesh(quad, sceneMat);
          sceneQuad.frustumCulled = false;
          var screenScene = new THREE.Scene();
          screenScene.add(sceneQuad);
          var flatCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
          onCover = function () {
            coverTex.needsUpdate = coverLoaded && coverImg.naturalWidth > 0;
          };
          onCover();

          // ----- 2. the TV -----
          var scene = new THREE.Scene();
          scene.background = new THREE.Color(0x000000);
          // (no reflected room: on matt grey plastic it barely showed, and it slowed every frame)
          var camera = new THREE.PerspectiveCamera(CAM_FOV, 1920 / 1080, 10, 600);

          var parts = TV.buildTV();
          var box = keep(new THREE.BoxGeometry(VOXEL, VOXEL, VOXEL));
          var plastic = keep(new THREE.MeshLambertMaterial({ color: 0xffffff }));
          var cabinetMat = keep(new THREE.MeshLambertMaterial({ color: 0xffffff }));
          var ledMat = keep(new THREE.MeshBasicMaterial({ color: 0xff3a2a }));
          var rng = V.mulberry32(23);
          function voxels(list, material, tint) {
            var mesh = new THREE.InstancedMesh(box, material, list.length);
            var m = new THREE.Matrix4();
            var c = new THREE.Color();
            for (var i = 0; i < list.length; i++) {
              var v = list[i];
              m.makeTranslation(v[0], v[1], v[2]);
              mesh.setMatrixAt(i, m);
              var s = TV.SHADES[v[3]] * (0.965 + 0.035 * rng());
              mesh.setColorAt(i, c.setRGB(s * tint[0], s * tint[1], s * tint[2]));
            }
            keep(mesh);
            scene.add(mesh);
            return mesh;
          }
          voxels(parts.bezel, plastic, [0.8, 0.79, 0.76]); // a slightly warm grey
          voxels(parts.cabinet, cabinetMat, [1.0, 0.97, 0.95]);
          voxels(parts.led, ledMat, [1, 1, 1]);
          // a dark backing behind it all: the seams between voxels show it, not black
          var backing = new THREE.Mesh(
            keep(new THREE.PlaneGeometry(200, 120)),
            keep(new THREE.MeshLambertMaterial({ color: 0x55524e })),
          );
          backing.position.z = -11;
          scene.add(backing);
          // the power light's glow: its own additive sprite (8-bit bloom wouldn't catch it)
          var ledGlowMat = keep(
            new THREE.SpriteMaterial({
              map: keep(glowTexture()),
              color: 0xff3a2a,
              blending: THREE.AdditiveBlending,
              transparent: true,
              depthWrite: false,
              opacity: 0.8,
            }),
          );
          var ledGlow = new THREE.Sprite(ledGlowMat);
          var ledAt = parts.led.reduce(
            function (s, v) {
              return [s[0] + v[0] / parts.led.length, s[1] + v[1] / parts.led.length];
            },
            [0, 0],
          );
          ledGlow.position.set(ledAt[0], ledAt[1], 2);
          ledGlow.scale.set(7, 7, 1);
          scene.add(ledGlow);

          // the screen: a curved mesh a little bigger than the opening (its edge tucks in
          // behind the tunnel walls)
          var S = parts.screen;
          var screenGeo = keep(
            new THREE.PlaneGeometry(2 * (S.halfW + 1.5), 2 * (S.halfH + 1.5), 96, 54),
          );
          var screenMat = keep(
            new THREE.ShaderMaterial({
              vertexShader: SCREEN_VS,
              fragmentShader: SCREEN_FS,
              uniforms: {
                sceneTex: { value: sceneTarget.texture },
                open: { value: new THREE.Vector2(S.halfW, S.halfH) },
                glassZ: { value: S.z },
                bulge: { value: BULGE },
                half_w: { value: S.halfW + 1.5 },
                half_h: { value: S.halfH + 1.5 },
                crt: { value: 0.7 },
                bright: { value: 1 },
                rollPos: { value: 0 },
                rollAlpha: { value: 0 },
                power: { value: 1 },
                glareShift: { value: 0 },
              },
            }),
          );
          var screen = new THREE.Mesh(screenGeo, screenMat);
          scene.add(screen);

          // light: a window from the top left, a soft fill, and the screen's own glow spilling
          // onto the bevel and the tunnel walls round it
          var hemi = new THREE.HemisphereLight(0xc4c8d8, 0x221a26, 0.55);
          scene.add(hemi);
          // a soft light from the front: the faces facing us stay brighter than the step walls
          var front = new THREE.DirectionalLight(0xf0f0f4, 1.25);
          front.position.set(-10, 15, 200);
          scene.add(front);
          // the window: a point light up and to the left, so the bezel is lit brighter at the
          // top left and falls off toward the bottom right
          var key = new THREE.PointLight(0xfff2e2, 1.05e4, 0, 1.6);
          key.position.set(-120, 110, 150);
          scene.add(key);
          var fill = new THREE.DirectionalLight(0xc8d0ff, 0.5);
          fill.position.set(110, -50, 120);
          scene.add(fill);
          var spills = [];
          // (two lights: each light costs every lit voxel's pixel, and two light all four walls)
          [
            [-32, 0],
            [32, 0],
          ].forEach(function (at) {
            var light = new THREE.PointLight(0xffffff, 0, 0, 1.6);
            light.position.set(at[0], at[1], -3);
            scene.add(light);
            spills.push(light);
          });

          function resize(scale) {
            var W = Math.round(1920 * scale),
              H = Math.round(1080 * scale);
            renderer.setSize(W, H, false);
            // the screen shows the scene about 1500 px wide, so it is drawn at 0.8 of full size
            sceneTarget.setSize(Math.round(W * SCENE_RES), Math.round(H * SCENE_RES));
            // lines never thinner than about one screen pixel: drawn wider and dimmer instead
            var px = 1 / (scale * SCENE_RES);
            var w = Math.max(SPEC_LINE, 1.2 * px);
            sceneMat.uniforms.px.value = px;
            sceneMat.uniforms.lineW.value = w;
            sceneMat.uniforms.lineGain.value = SPEC_LINE / w;
          }
          resize(PREVIEW_SCALE);

          // ----- settings: colours, audio, text (no new WebGL objects) -----
          var audio, specAudio, INT, BOOST, CRT, COUNT, LOUD, MAIN, SPILL;
          var loudTableFor = null;
          function apply() {
            INT = Number(setting("intensity"));
            BOOST = Number(setting("spectrumBoost")) || 1;
            if (!(INT >= 0)) INT = 1;
            CRT = Math.max(0, Math.min(1, Number(setting("crtEffect")) / 100));
            if (!(CRT >= 0)) CRT = 0.7;
            audio = V.createAudio(window.AUDIO_DATA, { beatRange: setting("beatRange") });
            COUNT = V.bandsToRingCount(Number(setting("bandCount")), 120);
            specAudio = V.createAudio(window.AUDIO_DATA, {
              spectrumLow: Number(setting("spectrumLow")),
              spectrumHigh: Number(setting("spectrumHigh")),
              spectrumBoost: 1, // the line's shape is unboosted; the boost sets its height
              spectrumCount: COUNT,
            });
            // the running loudness total for the grid's travel (once per song)
            if (loudTableFor !== window.AUDIO_DATA) {
              LOUD = M.loudTable(window.AUDIO_DATA.frames, window.AUDIO_DATA.fps);
              loudTableFor = window.AUDIO_DATA;
            }
            var main = V.hexToRGB(setting("mainColor"));
            var acc = V.hexToRGB(setting("accentColor"));
            MAIN = main;
            var u = sceneMat.uniforms;
            u.mainCol.value.setRGB(main[0], main[1], main[2]);
            u.accCol.value.setRGB(acc[0], acc[1], acc[2]);
            var top = add3([0.012, 0.006, 0.035], scale3(main, 0.03));
            var mid = add3([0.05, 0.008, 0.11], scale3(main, 0.17));
            u.skyTop.value.setRGB(top[0], top[1], top[2]);
            u.skyMid.value.setRGB(mid[0], mid[1], mid[2]);
            var sunTop = mix(main, [1, 0.92, 0.36], 0.78);
            u.sunTop.value.setRGB(sunTop[0], sunTop[1], sunTop[2]);
            u.sunBot.value.setRGB(main[0], main[1], main[2]);
            var floor = add3([0.012, 0.004, 0.03], scale3(main, 0.035));
            u.floorCol.value.setRGB(floor[0], floor[1], floor[2]);
            var ridge = add3([0.018, 0.006, 0.04], scale3(main, 0.03));
            u.ridgeCol.value.setRGB(ridge[0], ridge[1], ridge[2]);
            // the screen's light on the bezel: the scene's glow colour
            SPILL = mix(main, [0.35, 0.2, 0.9], 0.25);
            for (var i = 0; i < spills.length; i++)
              spills[i].color.setRGB(SPILL[0], SPILL[1], SPILL[2]);
            screenMat.uniforms.crt.value = CRT;
            drawText();
            textTex.needsUpdate = true;
          }
          apply();

          var specValues = new Float32Array(SPEC.texels);
          function render(t) {
            var songTime = t + audio.songStart;
            var a = audio.sample(t);
            var env = V.beatEnvelope(audio, t, BEAT_RELEASE);
            var lv = M.sceneLevels(a.loud, env, INT);
            var u = sceneMat.uniforms;
            u.lvGrid.value = lv.grid;
            u.lvHorizon.value = lv.horizon;
            u.lvGlow.value = lv.glow;
            u.lvSun.value = lv.sun;

            // the grid's travel (only its fraction shows, so the shader never sees big numbers)
            var travel = M.gridTravel(
              songTime,
              M.loudSeconds(LOUD, window.AUDIO_DATA.fps, audio.offset, t),
              INT,
            );
            u.travel.value = travel - Math.floor(travel);

            // the sun's gaps breathe on the beat
            var gaps = M.sunGaps(songTime, env);
            for (var g = 0; g < 7; g++) {
              if (g < gaps.length) u.gaps.value[g].set(gaps[g][0], gaps[g][1]);
              else u.gaps.value[g].set(0, 0);
            }

            // the horizon spectrum: the bass at both ends, shaped into peaks
            var heights = M.horizonHeights(
              M.horizonValues(V, specAudio.spectrum(t), COUNT),
              INT,
              BOOST,
            );
            var n = heights.length;
            for (var j = 0; j < SPEC.texels; j++) {
              var x = (j / (SPEC.texels - 1)) * (n - 1);
              var i0 = Math.min(n - 1, Math.floor(x));
              var i1 = Math.min(n - 1, i0 + 1);
              specValues[j] = heights[i0] + (heights[i1] - heights[i0]) * (x - i0);
              var b = Math.round((255 * specValues[j]) / M.SPEC_MAX);
              specData[4 * j] = Math.max(0, Math.min(255, b));
            }
            specTex.needsUpdate = true;

            // strong beats: the cover glitches, the screen dips and a roll line passes
            var beats = M.strongBeats(audio, t);
            var gl = M.glitch(beats, V.mulberry32);
            var has = coverLoaded && coverImg.naturalWidth > 0;
            u.hasCover.value = has ? 1 : 0;
            u.glitchOn.value = gl.active ? 1 : 0;
            u.split.value = gl.split;
            for (var s = 0; s < 4; s++) {
              if (s < gl.slices.length) {
                u.slices.value[s].set(gl.slices[s][0], gl.slices[s][1], gl.slices[s][2]);
              } else u.slices.value[s].set(0, 0, 0);
            }
            var hit = M.hitEnvelope(beats);
            var roll = M.rollLine(beats);
            var bright = (1 - M.flicker(songTime, V.mulberry32)) * (1 - M.screenDip(hit, INT));
            var su = screenMat.uniforms;
            su.bright.value = bright;
            su.rollPos.value = roll.pos;
            su.rollAlpha.value = roll.alpha * Math.min(1, INT) * (0.4 + 0.6 * CRT);
            su.power.value = Math.max(0, Math.min(1, (t - 0.05) / 0.55));

            // the camera drifts slowly round the TV, so the voxels catch the light
            var drift = M.cameraDrift(songTime, V.mulberry32);
            camera.position.set(
              CAM_DIST * Math.sin(drift[0]) * Math.cos(drift[1]),
              CAM_DIST * Math.sin(drift[1]),
              CAM_DIST * Math.cos(drift[0]) * Math.cos(drift[1]),
            );
            camera.lookAt(0, 0, 0);
            su.glareShift.value = drift[0] * 2.5;

            // the screen's glow on the bezel follows its brightness
            var spill = 440 * bright * (0.45 + 0.55 * lv.glow) * su.power.value;
            for (var l = 0; l < spills.length; l++) spills[l].intensity = spill;

            renderer.setRenderTarget(sceneTarget);
            renderer.render(screenScene, flatCam);
            renderer.setRenderTarget(null);
            renderer.render(scene, camera);
          }
          function textChanged() {
            drawText();
            textTex.needsUpdate = true;
          }
          function dispose() {
            for (var i = disposables.length - 1; i >= 0; i--) disposables[i].dispose();
            renderer.dispose();
          }
          return {
            render: render,
            dispose: dispose,
            apply: apply,
            resize: resize,
            textChanged: textChanged,
          };
        }

        function fail(error) {
          V.showError(String((error && error.message) || error));
        }
        var drawing = null; // { render(t), dispose(), apply(), resize(scale), textChanged() }
        var lastTime = -1;
        function draw(t) {
          if (!drawing) return;
          try {
            drawing.render(t);
            lastTime = t;
          } catch (error) {
            drawing = null;
            fail(error);
          }
        }
        try {
          drawing = setup();
        } catch (error) {
          fail(error);
        }
        draw(0);
        // The text is drawn on a canvas: draw it again whenever a font arrives.
        function fontsChanged() {
          if (drawing) drawing.textChanged();
          draw(Math.max(0, lastTime));
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fontsChanged);
        if (document.fonts && document.fonts.addEventListener) {
          document.fonts.addEventListener("loadingdone", fontsChanged);
        }
        window.addEventListener("hf-seek", function (e) {
          draw(e.detail.time);
        });

        // Live preview (the editor): new settings or a new preview resolution arrive as
        // runtime data. Renders never send any, so they look exactly as without this.
        var hf = window.__hyperframes;
        if (hf && hf.registerRuntimeDataHandler) {
          hf.registerRuntimeDataHandler("settings", function (values) {
            if (!values || typeof values !== "object") return;
            for (var key in values) if (key in DEFAULTS) vars[key] = values[key];
            setCover(setting("cover"));
            if (drawing) drawing.apply();
            draw(Math.max(0, lastTime));
          });
          hf.registerRuntimeDataHandler("preview", function (data) {
            var scale = Number(data && data.scale);
            if (!(scale > 0 && scale <= 1) || scale === PREVIEW_SCALE) return;
            PREVIEW_SCALE = scale;
            if (drawing) drawing.resize(scale);
            draw(Math.max(0, lastTime));
          });
        }

        // The whole picture fades to black over the song's last 2.5 s.
        var tl = gsap.timeline({ paused: true });
        tl.to(
          "#fade",
          { opacity: 1, duration: 2.5, ease: "power1.in" },
          Math.max(0, DURATION - 2.5),
        );
        // While the preview plays, the runtime advances this timeline (hf-seek only comes on
        // jumps), so draw on every timeline update too.
        tl.eventCallback("onUpdate", function () {
          var t = tl.time();
          if (t !== lastTime) draw(t);
        });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
