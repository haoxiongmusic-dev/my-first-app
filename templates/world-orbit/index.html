<!doctype html>
<!--
  World Orbit: a planet turns slowly in deep space (stars, a blue nebula haze, a slow camera
  drift), lit from the upper left with a bright rim of light round its edge. Very fine spectrum
  rays stick out from its rim, faint, brighter when the music is loud. The title, in big bold
  gold capitals, orbits the planet like a ring: the letters pass in front of it, turn edge-on
  round the sides and are hidden behind it, bigger and brighter at the front. A short title is
  repeated round the ring ("T-REX • T-REX • ..."); a long one goes round once, smaller. Now and
  then a warm diagonal light-leak streak sweeps across the right side. The artist sits small
  under the planet, and the planet pulses slightly on the beat.

  Song inputs (fixed paths, placed by the job builder): assets/song.wav, assets/audio-data.js.
  The committed root duration (20 s) matches the generated sample song; the job builder sets
  every data-song-length element to the real song's length. The motion maths lives in
  assets/orbit-motion.js and the beat maths in the toolkit (all unit-tested).

  The planet is drawn in code: by default a world of its own (oceans tinted by the accent
  colour, seeded noise continents, ice caps and clouds), never a photo. With a cover picture
  the cover is wrapped round the globe instead. The cover arrives as a picture location (the
  export's images folder, or the image route in the preview) or "" for none: it is set at
  startup and the frame is drawn again when it loads; a picture that fails to load is simply
  left out.

  Built in WebGL: the starfield and nebula are drawn once into a picture a little bigger than
  the frame, which slides with the camera drift. Each frame: the letters behind the planet, the
  rays, the planet (a ray-sphere shader on a square round it), the letters in front, a soft
  glow from the brightest parts, then the light leak and a vignette. The letters come from an
  atlas of the title's characters drawn once on a 2D canvas (bevelled gold). The artist is HTML.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"SONG NAME","maxLength":60},
    {"id":"artist","type":"string","label":"Artist","default":"ARTIST NAME","maxLength":60},
    {"id":"font","type":"enum","label":"Font","default":"Montserrat","options":[
      {"value":"Montserrat","label":"Montserrat"},
      {"value":"Inter","label":"Inter"},
      {"value":"Outfit","label":"Outfit"},
      {"value":"Poppins","label":"Poppins"},
      {"value":"Lato","label":"Lato"},
      {"value":"Oswald","label":"Oswald"},
      {"value":"Playfair Display","label":"Playfair Display"},
      {"value":"EB Garamond","label":"EB Garamond"}]},
    {"id":"cover","type":"image","label":"Cover art","default":"","fit":"square"},
    {"id":"mainColor","type":"color","label":"Main color","default":"#ffcc66"},
    {"id":"accentColor","type":"color","label":"Accent color","default":"#2a6cff"},
    {"id":"intensity","type":"number","label":"Intensity","default":1,"min":0.2,"max":2,"step":0.1},
    {"id":"orbitSeconds","type":"number","label":"Orbit time","default":12,"min":6,"max":30,"step":1,"unit":"s"},
    {"id":"scaleOnBeat","type":"boolean","label":"Scale on beat","default":true},
    {"id":"beatRange","type":"enum","label":"Beat range","default":"kick","options":[
      {"value":"kick","label":"Kick (auto)"},
      {"value":"20-90","label":"20–90 Hz"},
      {"value":"90-200","label":"90–200 Hz"},
      {"value":"20-200","label":"20–200 Hz"},
      {"value":"200-600","label":"200–600 Hz"},
      {"value":"600-3000","label":"600–3000 Hz"},
      {"value":"3000-8000","label":"3000–8000 Hz"},
      {"value":"8000-20000","label":"8000–20000 Hz"},
      {"value":"20-20000","label":"20–20000 Hz"}]},
    {"id":"spectrumLow","type":"number","label":"Spectrum low","default":30,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumHigh","type":"number","label":"Spectrum high","default":1000,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumBoost","type":"enum","label":"Spectrum boost","default":"8","options":[
      {"value":"1","label":"1×"},
      {"value":"2","label":"2×"},
      {"value":"4","label":"4×"},
      {"value":"8","label":"8×"}]},
    {"id":"bandCount","type":"number","label":"Bands","default":100,"min":10,"max":100,"step":1,"unit":"%"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/audio-data.js"></script>
    <script src="assets/viz-toolkit.js"></script>
    <script src="assets/orbit-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
      }
      #viz {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      /* The artist: small, centred under the planet. */
      #artistBlock {
        position: absolute;
        left: 0;
        width: 1920px;
        top: 826px;
        height: 60px;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        opacity: 0;
      }
      #songArtist {
        display: table; /* as wide as its text, so it can be measured and shrunk to fit */
        margin-left: auto;
        margin-right: auto;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: 0.5em;
        padding-left: 0.5em; /* balances the spacing after the last letter */
        text-transform: uppercase;
        white-space: nowrap;
        transform-origin: 50% 50%;
      }
      #coverImg,
      #fontPreload {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
      /* Mentioning every font family (and the bold weight the title is drawn in) lets
         HyperFrames bundle them all for the Font setting; the canvas letters use them once
         loaded. */
      .f-montserrat {
        font-family: "Montserrat";
      }
      .f-inter {
        font-family: "Inter";
      }
      .f-outfit {
        font-family: "Outfit";
      }
      .f-poppins {
        font-family: "Poppins";
      }
      .f-lato {
        font-family: "Lato";
      }
      .f-oswald {
        font-family: "Oswald";
      }
      .f-playfair {
        font-family: "Playfair Display";
      }
      .f-garamond {
        font-family: "EB Garamond";
      }
      .w800 {
        font-weight: 800;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="viz" width="1920" height="1080"></canvas>
      <div
        id="artistBlock"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="0"
      >
        <div id="songArtist" data-var-text="artist">ARTIST NAME</div>
      </div>
      <div
        id="fade"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="2"
      ></div>
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="1"
        data-volume="1"
        src="assets/song.wav"
      ></audio>
    </div>
    <img id="coverImg" alt="" />
    <div id="fontPreload" aria-hidden="true">
      <span class="f-montserrat">Aa</span><span class="f-montserrat w800">Aa•</span
      ><span class="f-inter">Aa</span><span class="f-inter w800">Aa•</span
      ><span class="f-outfit">Aa</span><span class="f-outfit w800">Aa•</span
      ><span class="f-poppins">Aa</span><span class="f-poppins w800">Aa•</span
      ><span class="f-lato">Aa</span><span class="f-lato w800">Aa•</span
      ><span class="f-oswald">Aa</span><span class="f-oswald w800">Aa•</span
      ><span class="f-playfair">Aa</span><span class="f-playfair w800">Aa•</span
      ><span class="f-garamond">Aa</span><span class="f-garamond w800">Aa•</span>
    </div>
    <script>
      (function () {
        var V = window.VizToolkit;
        var M = window.OrbitMotion;
        // Settings: the template's own declared defaults, overridden by the values HyperFrames
        // passes in (render) and, in the editor's live preview, by runtime-data messages.
        var DEFAULTS = V.declaredDefaults(
          document.documentElement.getAttribute("data-composition-variables"),
        );
        var given =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var vars = {};
        for (var id in DEFAULTS) vars[id] = DEFAULTS[id];
        for (var key in given)
          if (given[key] !== undefined && given[key] !== null) vars[key] = given[key];
        function setting(id) {
          return vars[id];
        }
        // Drawing resolution: always full size, except in the editor's preview (runtime data).
        var PREVIEW_SCALE = 1;
        var DURATION =
          parseFloat(document.getElementById("root").getAttribute("data-duration")) || 20;

        var drawing = null; // { render(t), uploadCover(), dispose() } from setup()
        var lastTime = -1;
        var fontEpoch = 0; // goes up when fonts finish loading, so the letters are drawn again
        var SEPARATOR = "•";

        // ---------- the cover picture ----------
        // The location is set at once, so the page's own loading waits for it; the frame is
        // drawn again when it arrives. A picture that fails to load is simply left out.
        var coverImg = document.getElementById("coverImg");
        var coverSrc = "";
        var coverLoaded = false;
        coverImg.addEventListener("load", function () {
          coverLoaded = true;
          if (drawing) drawing.uploadCover();
          draw(Math.max(0, lastTime));
        });
        coverImg.addEventListener("error", function () {
          coverLoaded = false;
          draw(Math.max(0, lastTime));
        });
        function setCover(value) {
          // HyperFrames hands an image setting over as text; accept { url } as well.
          var src = value && typeof value === "object" ? value.url || "" : value || "";
          if (src === coverSrc) return;
          coverSrc = src;
          coverLoaded = false;
          if (src) coverImg.src = src;
          else coverImg.removeAttribute("src");
        }
        setCover(setting("cover"));

        // ---------- the artist ----------
        function mixRGB(a, b, f) {
          return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
        }
        function css(c, alpha) {
          return (
            "rgba(" +
            Math.round(Math.max(0, Math.min(1, c[0])) * 255) +
            "," +
            Math.round(Math.max(0, Math.min(1, c[1])) * 255) +
            "," +
            Math.round(Math.max(0, Math.min(1, c[2])) * 255) +
            "," +
            alpha +
            ")"
          );
        }
        function applyPage() {
          var main = V.hexToRGB(setting("mainColor"));
          var acc = V.hexToRGB(setting("accentColor"));
          var block = document.getElementById("artistBlock");
          block.style.fontFamily = '"' + setting("font") + '", sans-serif';
          var artist = document.getElementById("songArtist");
          artist.style.color = css(mixRGB(main, [1, 1, 1], 0.55), 0.92);
          artist.style.textShadow =
            "0 0 10px " +
            css(mixRGB(acc, [0.6, 0.8, 1], 0.4), 0.55) +
            ", 0 0 26px " +
            css(acc, 0.35) +
            ", 0 1px 2px rgba(0,0,0,0.8)";
        }
        applyPage();

        // Fit the artist on one line, at most TEXT_SAFE wide: it shrinks to its smallest size,
        // then is scaled down so nothing can ever be wider. Measured on seeks, settings and
        // font loads only, never in the timeline callback.
        var TEXT_SAFE = 1300;
        var ARTIST_SIZE = 28,
          ARTIST_FLOOR = 15;
        var fitted = "";
        function fitArtist() {
          var line = document.getElementById("songArtist");
          var loaded = 0;
          if (document.fonts)
            document.fonts.forEach(function (face) {
              if (face.status === "loaded") loaded++;
            });
          var key = [line.textContent, setting("font"), loaded].join("|");
          if (key === fitted) return;
          fitted = key;
          var size = ARTIST_SIZE;
          line.style.transform = "";
          line.style.fontSize = size + "px";
          while (line.offsetWidth > TEXT_SAFE && size > ARTIST_FLOOR) {
            size = Math.max(ARTIST_FLOOR, Math.floor(size * 0.94));
            line.style.fontSize = size + "px";
          }
          var w = line.offsetWidth;
          line.style.transform = w > TEXT_SAFE ? "scale(" + (TEXT_SAFE / w).toFixed(4) + ")" : "";
        }

        // ---------- shaders ----------
        // Rays: triangles in 1080p pixels from the frame centre, y down, so they keep their size
        // at every preview resolution. Each vertex carries a colour and a `fall` position (-1..1
        // across the line: its light falls off from its middle). Light adds on.
        var SHAPE_VS = [
          "attribute vec2 pos; attribute vec3 col; attribute vec2 fall;",
          "varying vec3 vCol; varying vec2 vFall;",
          "void main(){",
          "  vCol = col; vFall = fall;",
          "  gl_Position = vec4(pos.x / 960.0, -pos.y / 540.0, 0.0, 1.0);",
          "}",
        ].join("\n");
        var SHAPE_FS = [
          "precision mediump float;",
          "varying vec3 vCol; varying vec2 vFall;",
          "void main(){",
          "  float f = clamp(1.0 - length(vFall), 0.0, 1.0);",
          "  gl_FragColor = vec4(vCol * f, 0.0);",
          "}",
        ].join("\n");
        // Letters: textured quads from the atlas (premultiplied), dimmed by depth.
        var LETTER_VS = [
          "attribute vec2 pos; attribute vec2 tc; attribute float lit;",
          "varying vec2 vTc; varying float vLit;",
          "void main(){",
          "  vTc = tc; vLit = lit;",
          "  gl_Position = vec4(pos.x / 960.0, -pos.y / 540.0, 0.0, 1.0);",
          "}",
        ].join("\n");
        var LETTER_FS = [
          "precision mediump float;",
          "uniform sampler2D atlas; uniform float fade;",
          "varying vec2 vTc; varying float vLit;",
          "void main(){",
          "  vec4 t = texture2D(atlas, vTc);",
          "  gl_FragColor = vec4(t.rgb * vLit, t.a) * fade;",
          "}",
        ].join("\n");
        var QUAD_VS =
          "attribute vec2 p; varying vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }";
        var COPY_FS =
          "precision highp float; uniform sampler2D src; varying vec2 uv; void main(){ gl_FragColor = texture2D(src, uv); }";
        // The brightest parts only, for the glow.
        var BRIGHT_FS = [
          "precision highp float; uniform sampler2D src; varying vec2 uv;",
          "void main(){",
          "  vec3 c = texture2D(src, uv).rgb;",
          "  float m = max(c.r, max(c.g, c.b));",
          "  gl_FragColor = vec4(c * smoothstep(0.55, 1.0, m), 1.0);",
          "}",
        ].join("\n");
        var BLUR_FS = [
          "precision highp float;",
          "uniform sampler2D src; uniform vec2 dir; varying vec2 uv;",
          "void main(){",
          "  vec3 c = texture2D(src, uv).rgb * 0.227027;",
          "  c += texture2D(src, uv + dir * 1.3846).rgb * 0.316216; c += texture2D(src, uv - dir * 1.3846).rgb * 0.316216;",
          "  c += texture2D(src, uv + dir * 3.2308).rgb * 0.070270; c += texture2D(src, uv - dir * 3.2308).rgb * 0.070270;",
          "  gl_FragColor = vec4(c, 1.0);",
          "}",
        ].join("\n");
        // Deep space, drawn once into a picture MARGIN px bigger than the frame on every side:
        // a dark base, a blue nebula haze in a diagonal band and round the planet, darker dust
        // lanes, and three layers of stars (many faint ones, fewer brighter ones with a soft
        // glow, and a few big ones with small cross flares). A tiny fixed dither stops banding.
        var SPACE_FS = [
          "precision highp float;",
          "uniform vec3 accCol; uniform float pxScale; uniform vec2 size; uniform float margin;",
          "varying vec2 uv;",
          "float hash(vec2 p){ return fract(sin(dot(mod(p, 256.0), vec2(127.1, 311.7))) * 43758.5453); }",
          "float noise(vec2 p){",
          "  vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);",
          "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);",
          "}",
          "float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int k = 0; k < 6; k++) { s += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }",
          // one star per cell (maybe): a sharp dot never smaller than about a screen pixel, a
          // soft glow, and (flare > 0) thin cross spikes
          "vec3 star(vec2 p, float cell, float chance, float seed, float rad, float bright, float glowR, float glowK, float flare){",
          "  vec2 c = floor(p / cell);",
          "  vec2 k = c + vec2(seed, seed * 1.7);",
          "  if (hash(k) > chance) return vec3(0.0);",
          "  vec2 at = (c + 0.2 + 0.6 * vec2(hash(k + 3.1), hash(k + 7.3))) * cell;",
          "  vec2 d = p - at;",
          "  float rr = max(rad, 0.75 / pxScale);",
          "  float b = bright * (0.35 + 0.65 * hash(k + 5.9)) * (rad / rr) * (rad / rr);",
          "  float v = b * exp(-dot(d, d) / (2.0 * rr * rr));",
          "  v += b * glowK * exp(-length(d) / glowR);",
          "  if (flare > 0.0) {",
          "    float fl = exp(-abs(d.y) * 1.6 * pxScale) * exp(-abs(d.x) / flare) + exp(-abs(d.x) * 1.6 * pxScale) * exp(-abs(d.y) / flare);",
          "    v += b * 0.35 * fl;",
          "  }",
          "  float temp = hash(k + 9.4);",
          "  vec3 tint = temp < 0.3 ? vec3(0.75, 0.85, 1.0) : (temp > 0.85 ? vec3(1.0, 0.86, 0.7) : vec3(1.0));",
          "  return tint * v;",
          "}",
          "void main(){",
          "  vec2 p = vec2(uv.x * size.x, (1.0 - uv.y) * size.y) - margin;", // frame pixels
          "  vec2 q = p / 1080.0;",
          "  float n1 = fbm(q * 2.1 + vec2(3.1, 7.4));",
          "  float n2 = fbm(q * 4.3 + vec2(n1 * 1.9, 2.0));",
          // a haze band rising from the lower left to the upper right, and a glow round the planet
          "  float bd = dot(q - vec2(0.95, 0.5), normalize(vec2(0.42, 0.91)));",
          "  float band = exp(-bd * bd * 7.0);",
          "  vec2 pc = (p - vec2(960.0, 505.0)) / 1080.0;",
          "  float near = exp(-dot(pc, pc) * 5.5);",
          "  float haze = band * (0.25 + 1.1 * smoothstep(0.38, 0.82, n2)) + 0.55 * near * (0.55 + 0.45 * n1);",
          "  vec3 neb = mix(vec3(0.07, 0.15, 0.46), accCol, 0.55);",
          "  vec3 neb2 = mix(vec3(0.30, 0.12, 0.48), neb, 0.45);",
          "  vec3 c = vec3(0.004, 0.006, 0.018) + mix(neb, neb2, smoothstep(0.42, 0.68, n1)) * haze * 0.3;",
          "  c *= 1.0 - 0.55 * band * smoothstep(0.52, 0.74, fbm(q * 7.5 + vec2(11.0, 4.0)));",
          "  float dens = 0.6 + 1.2 * band;",
          "  c += star(p, 8.0, 0.05 * dens, 1.0, 0.55, 0.55, 1.0, 0.0, 0.0);",
          "  c += star(p, 36.0, 0.22 * dens, 17.0, 0.8, 1.0, 2.2, 0.06, 0.0);",
          "  c += star(p, 170.0, 0.32, 41.0, 1.2, 1.6, 6.0, 0.07, 9.0);",
          "  c += (hash(floor(p) + vec2(5.0, 9.0)) - 0.5) / 255.0;",
          "  gl_FragColor = vec4(c, 1.0);",
          "}",
        ].join("\n");
        // The space picture on the frame, shifted by the camera drift and lifted a little with
        // the music's loudness.
        var BACKDROP_FS = [
          "precision highp float;",
          "uniform sampler2D space; uniform vec2 size; uniform float margin; uniform vec2 drift; uniform float gain;",
          "varying vec2 uv;",
          "void main(){",
          "  vec2 p = vec2(uv.x * 1920.0, (1.0 - uv.y) * 1080.0) + margin + drift;",
          "  vec3 c = texture2D(space, vec2(p.x / size.x, 1.0 - p.y / size.y)).rgb;",
          "  gl_FragColor = vec4(c * gain, 1.0);",
          "}",
        ].join("\n");
        // The planet, drawn on a square round it: for each pixel inside the disc, the point on
        // the sphere it sees (ray-sphere), turned into the planet's own frame (the ring's tilt,
        // the view from a little above, and its spin), coloured by seeded 3D noise (continents,
        // oceans tinted by the accent colour, ice caps, clouds that turn a little faster) or by
        // the cover wrapped round it, then lit from the upper left with a soft terminator, an
        // ocean glint, a hazy atmosphere toward the edge, a bright rim light and a glow outside.
        // Every exp() here is given an argument that can never be positive.
        var PLANET_VS = [
          "attribute vec2 p; uniform vec3 box;",
          "void main(){",
          "  vec2 px = box.xy + vec2(p.x, -p.y) * box.z;",
          "  gl_Position = vec4(px.x / 960.0 - 1.0, 1.0 - px.y / 540.0, 0.0, 1.0);",
          "}",
        ].join("\n");
        var PLANET_FS = [
          "precision highp float;",
          "uniform vec3 centre;", // x, y, radius (1080p px, y down)
          "uniform float pxScale, spin, cloudSpin, glow, hasCover, tilt, sinView;",
          "uniform vec3 accCol;",
          "uniform sampler2D cover;",
          "float hash3(vec3 p){ return fract(sin(dot(mod(p, 256.0), vec3(127.1, 311.7, 74.7))) * 43758.5453); }",
          "float noise3(vec3 p){",
          "  vec3 i = floor(p); vec3 f = fract(p); f = f * f * (3.0 - 2.0 * f);",
          "  float a = hash3(i), b = hash3(i + vec3(1.0, 0.0, 0.0)), c = hash3(i + vec3(0.0, 1.0, 0.0)), d = hash3(i + vec3(1.0, 1.0, 0.0));",
          "  float e = hash3(i + vec3(0.0, 0.0, 1.0)), g = hash3(i + vec3(1.0, 0.0, 1.0)), h = hash3(i + vec3(0.0, 1.0, 1.0)), k = hash3(i + vec3(1.0, 1.0, 1.0));",
          "  return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y), mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);",
          "}",
          "float fbm6(vec3 p){ float s = 0.0, a = 0.5; for (int k = 0; k < 6; k++) { s += a * noise3(p); p = p * 2.02 + vec3(5.3, 1.7, 9.1); a *= 0.5; } return s; }",

          "    vec3 shallow = mix(deep, accCol * 0.72 + vec3(0.03, 0.10, 0.12), 0.7);",
          "    vec3 ocean = mix(deep, shallow, coast * coast);",
          "    float m2 = fbm4(g * 4.6 + vec3(3.1, 0.4, 6.2));",
          "    vec3 green = vec3(0.10, 0.19, 0.08), dry = vec3(0.46, 0.37, 0.23), dark = vec3(0.05, 0.10, 0.05), high = vec3(0.55, 0.50, 0.44);",

        // Everything together: the frame, a soft glow from its brightest parts, the light leak

            verts[o + 4] = c[2] * k;
            verts[o + 5] = fx;
            verts[o + 6] = fy;
          }
          /**
           * A line this many 1080p pixels wide, never thinner than about one screen pixel:
           * a thinner line is drawn wider and dimmer, so the preview shows what the render
           * shows when scaled down.
           */
          function thin(width) {
            var w = Math.max(width, 1.2 / PREVIEW_SCALE);
            return [w, width / w];
          }
          /** A straight stroke from (x0, y0) to (x1, y1), coloured c, brightness kA → kB. */
          function stroke(x0, y0, x1, y1, width, c, kA, kB) {
            var t = thin(width);
            var dx = x1 - x0,
              dy = y1 - y0;
            var len = Math.sqrt(dx * dx + dy * dy) || 1;
            var nx = (-dy / len) * t[0],
              ny = (dx / len) * t[0];
            var ka = kA * t[1],
              kb = kB * t[1];
            vert(x0 + nx, y0 + ny, c, ka, 1, 0);
            vert(x0 - nx, y0 - ny, c, ka, -1, 0);
            vert(x1 - nx, y1 - ny, c, kb, -1, 0);
            vert(x0 + nx, y0 + ny, c, ka, 1, 0);
            vert(x1 - nx, y1 - ny, c, kb, -1, 0);
            vert(x1 + nx, y1 + ny, c, kb, 1, 0);
          }
          var RAY_COL = mixRGB([1, 1, 1], mixRGB(ACC, [0.6, 0.8, 1], 0.5), 0.3);
          function buildRays(t, radius, loud) {
            nv = 0;
            audio.spectrum(t, spec);
            var lens = M.rayLengths(V.ringValues(spec, ANGLES, 360), RAY_W, INT);
            var level = M.rayLevel(loud);
            var cap = M.RAY_MAX * Math.max(0.2, Math.min(2, INT));
            for (var i = 0; i < RAYS; i++) {
              var len = lens[i];
              if (len < 0.5) continue;
              var dir = RAY_DIRS[i];
              var r0 = radius + 3;
              var k = level * (0.45 + 0.55 * Math.min(1, len / cap));
              stroke(
                M.PLANET_X + dir[0] * r0,
                M.PLANET_Y + dir[1] * r0,
                M.PLANET_X + dir[0] * (r0 + len),
                M.PLANET_Y + dir[1] * (r0 + len),
                1.1,
                RAY_COL,
                k,
                0,
              );
            }
          }

          function bindTarget(tg) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, tg ? tg.fb : null);
            gl.viewport(0, 0, tg ? tg.w : W, tg ? tg.h : H);
          }
          function pass(prog, src, dst) {
            bindTarget(dst);
            gl.useProgram(prog);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, src.tex);
            gl.uniform1i(prog.u.src, 0);
            V.drawQuad(gl, prog);
          }
          function drawBuffer(prog, buf, data, count, stride, layoutList) {
            if (count === 0) return;
            gl.useProgram(prog);
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, stride * count), gl.DYNAMIC_DRAW);
            var locs = [],
              offset = 0;
            for (var j = 0; j < layoutList.length; j++) {
              var loc = gl.getAttribLocation(prog, layoutList[j][0]);
              gl.enableVertexAttribArray(loc);
              gl.vertexAttribPointer(
                loc,
                layoutList[j][1],
                gl.FLOAT,
                false,
                stride * 4,
                offset * 4,
              );
              offset += layoutList[j][1];
              locs.push(loc);
            }
            gl.drawArrays(gl.TRIANGLES, 0, count);
            for (var k = 0; k < locs.length; k++) gl.disableVertexAttribArray(locs[k]);
          }
          var LETTER_LAYOUT = [
            ["pos", 2],
            ["tc", 2],
            ["lit", 1],
          ];
          var SHAPE_LAYOUT = [
            ["pos", 2],
            ["col", 3],
            ["fall", 2],
          ];
          function drawLetters(fade) {
            if (lv === 0) return;
            gl.useProgram(letterProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, atlasTex);
            gl.uniform1i(letterProg.u.atlas, 0);
            gl.uniform1f(letterProg.u.fade, fade);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            drawBuffer(letterProg, letterBuf, lverts, lv, LSTRIDE, LETTER_LAYOUT);
            gl.disable(gl.BLEND);
          }

          // Deep space never changes, so it is drawn once.
          (function drawSpace() {
            bindTarget(space);
            gl.useProgram(spaceProg);
            gl.uniform3fv(spaceProg.u.accCol, ACC_LIT);
            gl.uniform1f(spaceProg.u.pxScale, S);
            gl.uniform2f(spaceProg.u.size, SW, SH);
            gl.uniform1f(spaceProg.u.margin, MARGIN);
            V.drawQuad(gl, spaceProg);
          })();

          var WARM = mixRGB([1.0, 0.52, 0.2], MAIN, 0.25);

          function renderAt(t) {
            var songTime = t + audio.songStart;
            var a = audio.sample(t);
            var env = V.beatEnvelope(audio, t, M.PULSE_RELEASE);
            var scale = M.planetScale(env, SCALE_ON_BEAT);
            var glow = M.glowLevel(a.loud);
            var radius = M.PLANET_R * scale;
            if (atlasEpoch !== fontEpoch) buildAtlas();
            var poses = M.placeLetters(layout, songTime, ORBIT);
            var behind = 0;
            while (behind < poses.length && poses[behind].depth < 0) behind++;
            var drift = M.drift(songTime);
            var leak = M.lightLeak(songTime, V.mulberry32);
            var fadeIn = Math.max(0, Math.min(1, (t - 0.1) / 1.2));
            fadeIn = fadeIn * fadeIn * (3 - 2 * fadeIn);
            var glint = 0.18 * env;

            // 1. space, drifting with the camera
            bindTarget(scene);
            gl.useProgram(backdropProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, space.tex);
            gl.uniform1i(backdropProg.u.space, 0);
            gl.uniform2f(backdropProg.u.size, SW, SH);
            gl.uniform1f(backdropProg.u.margin, MARGIN);
            gl.uniform2f(backdropProg.u.drift, drift[0], drift[1]);
            gl.uniform1f(backdropProg.u.gain, 0.45 + 0.55 * glow);
            V.drawQuad(gl, backdropProg);

            // 2. the letters behind the planet (the farthest first)
            buildLetters(poses, 0, behind, glint);
            drawLetters(fadeIn);

            // 3. the rays, light adding on
            buildRays(t, radius, a.loud);
            if (nv > 0) {
              gl.enable(gl.BLEND);
              gl.blendFunc(gl.ONE, gl.ONE);
              drawBuffer(shapeProg, shapeBuf, verts, nv, STRIDE, SHAPE_LAYOUT);
              gl.disable(gl.BLEND);
            }

            // 4. the planet, hiding what is behind it; its glow adds on outside
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            gl.useProgram(planetProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, coverTex);
            gl.uniform1i(planetProg.u.cover, 0);
            gl.uniform3f(planetProg.u.box, M.PLANET_X, M.PLANET_Y, radius * 1.6);
            gl.uniform3f(planetProg.u.centre, M.PLANET_X, M.PLANET_Y, radius);
            gl.uniform1f(planetProg.u.pxScale, S);
            gl.uniform1f(planetProg.u.spin, M.planetSpin(songTime));
            gl.uniform1f(planetProg.u.cloudSpin, M.planetSpin(songTime * 0.18));
            gl.uniform1f(planetProg.u.glow, glow);
            gl.uniform1f(planetProg.u.hasCover, coverReady && coverLoaded ? 1 : 0);
            gl.uniform1f(planetProg.u.tilt, M.RING_TILT);
            gl.uniform1f(planetProg.u.sinView, M.RING_RY / M.RING_RX);
            gl.uniform3fv(planetProg.u.accCol, ACC_LIT);
            V.drawQuad(gl, planetProg);
            gl.disable(gl.BLEND);

            // 5. the letters in front of it (the nearest last)
            buildLetters(poses, behind, poses.length, glint);
            drawLetters(fadeIn);

            // 6. a soft glow from the brightest parts: half and quarter size (radii kept in
            // 1080p terms)
            pass(brightProg, scene, hA);
            V.blur(gl, blurProg, hA, hB, 1.5 * S);
            V.blur(gl, blurProg, hA, hB, 3.0 * S);
            pass(copyProg, hA, qA);
            V.blur(gl, blurProg, qA, qB, 2.0 * S);
            V.blur(gl, blurProg, qA, qB, 4.0 * S);

            // 7. the whole picture onto the screen, with the light leak and the vignette
            bindTarget(null);
            gl.useProgram(compProg);
            var units = [
              ["scene", scene.tex],
              ["bloomA", hA.tex],
              ["bloomB", qA.tex],
            ];
            for (var u = 0; u < units.length; u++) {
              gl.activeTexture(gl.TEXTURE0 + u);
              gl.bindTexture(gl.TEXTURE_2D, units[u][1]);
              gl.uniform1i(compProg.u[units[u][0]], u);
            }
            gl.uniform4f(compProg.u.leak, leak.x, leak.y, leak.angle, leak.width);
            gl.uniform1f(compProg.u.leakK, leak.strength);
            gl.uniform3fv(compProg.u.warm, WARM);
            V.drawQuad(gl, compProg);
            gl.activeTexture(gl.TEXTURE0);
          }
          return { render: renderAt, uploadCover: uploadCover, dispose: tracked.dispose };
        }

        function fail(error) {
          V.showError(String((error && error.message) || error));
        }
        function draw(t) {
          if (!drawing) return;
          try {
            drawing.render(t);
            lastTime = t;
          } catch (error) {
            drawing = null;
            fail(error);
          }
        }
        /** (Re)create everything that depends on the settings, freeing what came before. */
        function rebuild() {
          if (drawing) drawing.dispose();
          drawing = null;
          try {
            drawing = setup();
            var shown = document.getElementById("viz-error");
            if (shown) shown.remove();
          } catch (error) {
            fail(error);
          }
        }
        rebuild();
        fitArtist();
        draw(0);
        function fontsChanged() {
          fontEpoch++;
          fitArtist();
          draw(Math.max(0, lastTime));
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fontsChanged);
        if (document.fonts && document.fonts.addEventListener) {
          document.fonts.addEventListener("loadingdone", fontsChanged);
        }
        window.addEventListener("hf-seek", function (e) {
          fitArtist(); // the artist is measured here, not in the timeline callback below
          draw(e.detail.time);
        });

        // Live preview (the editor): new settings or a new preview resolution arrive as
        // runtime data. Renders never send any, so they look exactly as without this.
        var hf = window.__hyperframes;
        if (hf && hf.registerRuntimeDataHandler) {
          hf.registerRuntimeDataHandler("settings", function (values) {
            if (!values || typeof values !== "object") return;
            for (var key in values) if (key in DEFAULTS) vars[key] = values[key];
            document.getElementById("songArtist").textContent = setting("artist");
            setCover(setting("cover"));
            applyPage();
            fitArtist();
            rebuild();
            draw(Math.max(0, lastTime));
          });
          hf.registerRuntimeDataHandler("preview", function (data) {
            var scale = Number(data && data.scale);
            if (!(scale > 0 && scale <= 1) || scale === PREVIEW_SCALE) return;
            PREVIEW_SCALE = scale;
            rebuild();
            draw(Math.max(0, lastTime));
          });
        }

        // The artist fades in; the whole picture fades to black over the song's last 2.5 s (the
        // title fades in by itself, drawn from the time).
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#artistBlock",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 1.6, ease: "power2.out" },
          0.6,
        );
        tl.to(
          "#fade",
          { opacity: 1, duration: 2.5, ease: "power1.in" },
          Math.max(0, DURATION - 2.5),
        );
        // While the preview plays, the runtime advances this timeline (hf-seek only comes on
        // jumps), so draw on every timeline update too.
        tl.eventCallback("onUpdate", function () {
          var t = tl.time();
          if (t !== lastTime) draw(t);
        });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
