<!doctype html>
<!--
  Particle Horizon (in the style of the owner's "Sunlight" videos): a glowing particle sea
  rolling toward a warm horizon. The surface swells with the music: the spectrum history
  shapes it, loudness lifts it, and each beat sends a ripple outward from the front.

  Song inputs (fixed paths, placed by the job builder): assets/song.wav, assets/audio-data.js.
  The committed root duration (20 s) matches the generated sample song; the job builder sets
  every data-song-length element to the real song's length.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"SUNLIGHT","maxLength":60},
    {"id":"artist","type":"string","label":"Artist","default":"AXIOM","maxLength":60},
    {"id":"font","type":"enum","label":"Font","default":"Montserrat","options":[
      {"value":"Montserrat","label":"Montserrat"},
      {"value":"Inter","label":"Inter"},
      {"value":"Outfit","label":"Outfit"},
      {"value":"Poppins","label":"Poppins"},
      {"value":"Lato","label":"Lato"},
      {"value":"Oswald","label":"Oswald"},
      {"value":"Playfair Display","label":"Playfair Display"},
      {"value":"EB Garamond","label":"EB Garamond"}]},
    {"id":"mainColor","type":"color","label":"React color","default":"#ff6a12"},
    {"id":"highlightColor","type":"color","label":"Highlight color","default":"#ffd38a"},
    {"id":"tint","type":"number","label":"Discoloration","default":20,"min":0,"max":100,"step":1,"unit":"%"},
    {"id":"intensity","type":"number","label":"Intensity","default":1,"min":0.2,"max":2,"step":0.1},
    {"id":"letterbox","type":"boolean","label":"Movie box (letterbox bars)","default":true},
    {"id":"showBackground","type":"boolean","label":"Show background","default":false},
    {"id":"backgroundBlur","type":"number","label":"Background blur","default":100,"min":0,"max":100,"step":1,"unit":"%"},
    {"id":"densityX","type":"number","label":"Threads X","default":100,"min":25,"max":200,"step":1,"unit":"%"},
    {"id":"densityY","type":"number","label":"Threads Y","default":100,"min":25,"max":200,"step":1,"unit":"%"},
    {"id":"waveScale","type":"number","label":"Wave size","default":100,"min":25,"max":300,"step":1,"unit":"%"},
    {"id":"waveHeight","type":"number","label":"Wave height","default":100,"min":0,"max":300,"step":1,"unit":"%"},
    {"id":"flowSpeed","type":"number","label":"Flow speed","default":100,"min":0,"max":300,"step":1,"unit":"%"},
    {"id":"waveSpeed","type":"number","label":"Wave speed","default":100,"min":0,"max":300,"step":1,"unit":"%"},
    {"id":"beatRange","type":"enum","label":"Beat range","default":"kick","options":[
      {"value":"kick","label":"Kick (auto)"},
      {"value":"20-90","label":"20–90 Hz"},
      {"value":"90-200","label":"90–200 Hz"},
      {"value":"20-200","label":"20–200 Hz"},
      {"value":"200-600","label":"200–600 Hz"},
      {"value":"600-3000","label":"600–3000 Hz"},
      {"value":"3000-8000","label":"3000–8000 Hz"},
      {"value":"8000-20000","label":"8000–20000 Hz"},
      {"value":"20-20000","label":"20–20000 Hz"}]},
    {"id":"spectrumLow","type":"number","label":"Spectrum low","default":30,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumHigh","type":"number","label":"Spectrum high","default":16000,"min":30,"max":16000,"step":10,"unit":"Hz"},
    {"id":"spectrumBoost","type":"enum","label":"Spectrum boost","default":"1","options":[
      {"value":"1","label":"1×"},
      {"value":"2","label":"2×"},
      {"value":"4","label":"4×"},
      {"value":"8","label":"8×"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/audio-data.js"></script>
    <script src="assets/viz-toolkit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #000;
      }
      #viz {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 132px;
        background: #000;
      }
      #titles {
        position: absolute;
        left: 0;
        right: 0;
        top: 742px;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        color: #fbeee0;
        opacity: 0;
      }
      #title,
      #artist {
        display: table; /* as wide as its text, so it can be measured and shrunk to fit */
        margin-left: auto;
        margin-right: auto;
      }
      #title {
        font-size: 58px;
        font-weight: 300;
        letter-spacing: 0.3em;
        padding-left: 0.3em;
        white-space: nowrap;
        text-shadow: 0 0 22px rgba(255, 150, 60, 0.55);
      }
      #artist {
        font-size: 28px;
        font-weight: 400;
        opacity: 0.75;
        letter-spacing: 0.55em;
        padding-left: 0.55em;
        margin-top: 10px;
        white-space: nowrap;
      }
      #bgImage,
      #fontPreload {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }
      /* Mentioning every font family lets HyperFrames bundle them all for the Font setting. */
      .f-montserrat {
        font-family: "Montserrat";
      }
      .f-inter {
        font-family: "Inter";
      }
      .f-outfit {
        font-family: "Outfit";
      }
      .f-poppins {
        font-family: "Poppins";
      }
      .f-lato {
        font-family: "Lato";
      }
      .f-oswald {
        font-family: "Oswald";
      }
      .f-playfair {
        font-family: "Playfair Display";
      }
      .f-garamond {
        font-family: "EB Garamond";
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="viz" width="1920" height="1080"></canvas>
      <div id="barTop" class="bar" style="top: 0"></div>
      <div id="barBottom" class="bar" style="bottom: 0"></div>
      <div
        id="titles"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="0"
      >
        <div id="title" data-var-text="title">SUNLIGHT</div>
        <div id="artist" data-var-text="artist">AXIOM</div>
      </div>
      <div
        id="fade"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="2"
      ></div>
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="20"
        data-song-length
        data-track-index="1"
        data-volume="1"
        src="assets/song.wav"
      ></audio>
    </div>
    <img id="bgImage" src="assets/background.jpg" alt="" />
    <div id="fontPreload" aria-hidden="true">
      <span class="f-montserrat">Aa</span><span class="f-inter">Aa</span>
      <span class="f-outfit">Aa</span><span class="f-poppins">Aa</span>
      <span class="f-lato">Aa</span><span class="f-oswald">Aa</span>
      <span class="f-playfair">Aa</span><span class="f-garamond">Aa</span>
    </div>
    <script>
      (function () {
        var V = window.VizToolkit;
        // Settings: the template's own declared defaults, overridden by the values HyperFrames
        // passes in (render) and, in the editor's live preview, by runtime-data messages.
        var DEFAULTS = V.declaredDefaults(
          document.documentElement.getAttribute("data-composition-variables"),
        );
        var given =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var vars = {};
        for (var id in DEFAULTS) vars[id] = DEFAULTS[id];
        for (var key in given)
          if (given[key] !== undefined && given[key] !== null) vars[key] = given[key];
        function setting(id) {
          return vars[id];
        }
        // Drawing resolution: always full size, except in the editor's preview (runtime data).
        var PREVIEW_SCALE = 1;
        var DURATION =
          parseFloat(document.getElementById("root").getAttribute("data-duration")) || 20;

        function applyPage() {
          var bars = setting("letterbox") === false ? "none" : "";
          document.getElementById("barTop").style.display = bars;
          document.getElementById("barBottom").style.display = bars;
          document.getElementById("titles").style.fontFamily =
            '"' + setting("font") + '", sans-serif';
        }
        applyPage();

        // Shrink a title line until it fits the 80 % title-safe width; hide empty lines.
        var TITLE_SAFE = 1536;
        var fitted = "";
        function fitTitles() {
          var title = document.getElementById("title");
          var artist = document.getElementById("artist");
          var key = title.textContent + "|" + artist.textContent;
          if (key === fitted) return;
          fitted = key;
          [
            [title, 58],
            [artist, 28],
          ].forEach(function (line) {
            var el = line[0],
              size = line[1];
            el.style.display = el.textContent.trim() ? "" : "none";
            el.style.fontSize = size + "px";
            while (el.offsetWidth > TITLE_SAFE && size > 12) {
              size = Math.floor(size * 0.95);
              el.style.fontSize = size + "px";
            }
          });
        }

        // ---------- shaders (from the approved prototype) ----------
        var PARTICLE_VS = [
          "precision highp float;",
          "attribute vec3 g;",
          "uniform sampler2D spec;",
          "uniform float t, loud, kick, flux, inten;",
          "uniform vec4 hits;      // ages of the last 4 hits (seconds)",
          "uniform vec4 hitStr;    // their strengths",
          "uniform float waveK, waveH, flow, evo, sizeMul, densGain;",
          "varying float vBright; varying float vHeight; varying float vX;",
          "void main(){",
          "  float x = (g.x - 0.5) * 34.0;",
          "  float z = 1.6 + pow(g.y, 1.35) * 30.0;",
          "  float zt = z + t * 1.6 * flow;",
          "  float h = sin((x*0.23 + zt*0.33)*waveK + t*0.15*evo)*0.55 + sin((x*0.51 - zt*0.27)*waveK + 1.3 - t*0.15*evo)*0.32 + sin((x*1.13 + zt*0.71)*waveK - t*0.4*evo)*0.14;",
          "  h *= waveH;",
          "  h *= 0.55 + loud * 0.85 * inten;",
          "  float sb = clamp(abs(x) / 17.0, 0.0, 1.0);",
          "  float s = texture2D(spec, vec2(0.02 + sb * 0.96, g.y)).r;",
          "  h += pow(s, 1.6) * 1.35 * inten * (1.0 - 0.4 * g.y);",
          "  float rr = length(vec2(x, (z - 3.0) * 1.4));",
          "  for (int i = 0; i < 4; i++) {",
          "    float age = hits[i]; float front = age * 11.0;",
          "    float ring = exp(-pow(rr - front, 2.0) / 5.0) * exp(-age * 1.6) * hitStr[i];",
          "    h += ring * 0.9 * inten;",
          "  }",
          "  h *= 0.5 + 0.5 * smoothstep(2.0, 11.0, z);",
          "  float camY = 2.25;",
          "  float sx = x / z * 0.62;",
          "  float sy = (h - camY) / z * 1.10 + 0.17;",
          "  gl_Position = vec4(sx, sy, 0.0, 1.0);",
          "  float sparkle = step(0.93, fract(g.z * 13.0 + t * 0.7)) * flux * 1.8;",
          "  gl_PointSize = clamp(2.8 * 4.0 / z, 1.1, 4.5) * (1.0 + sparkle * 0.7) * sizeMul;",
          "  vX = g.x;",
          "  float fog = smoothstep(31.0, 6.0, z);",
          "  vBright = (0.35 + 0.65 * fog) * (0.6 + 0.55 * loud + 0.35 * kick) * (1.0 + sparkle) * densGain;",
          "  vHeight = clamp(h * 0.5 + 0.5, 0.0, 1.0);",
          "}",
        ].join("\n");
        var PARTICLE_FS = [
          "precision highp float;",
          "uniform vec3 mainCol, hiCol;",
          "uniform float tint, t;",
          "varying float vBright; varying float vHeight; varying float vX;",
          "vec3 hueRotate(vec3 c, float a){ vec3 k = vec3(0.57735); float ca = cos(a); return c*ca + cross(k, c)*sin(a) + k*dot(k, c)*(1.0 - ca); }",
          "void main(){",
          "  vec2 d = gl_PointCoord - 0.5; float a = exp(-dot(d,d) * 14.0);",
          "  vec3 col = mix(mainCol * vec3(0.9,0.55,0.45), hiCol, smoothstep(0.3, 1.0, vHeight));",
          "  // Discoloration: the hue drifts across the field (a full rainbow at 100 %)",
          "  col = max(hueRotate(col, tint * (6.2831853 * (vX - 0.5) + 0.6981317 * sin(0.05 * t))), 0.0);",
          "  gl_FragColor = vec4(col * a * vBright * 0.85, 1.0);",
          "}",
        ].join("\n");
        var QUAD_VS =
          "attribute vec2 p; varying vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }";
        var COPY_FS =
          "precision highp float; uniform sampler2D src; varying vec2 uv; void main(){ gl_FragColor = texture2D(src, uv); }";
        var BLUR_FS = [
          "precision highp float;",
          "uniform sampler2D src; uniform vec2 dir; varying vec2 uv;",
          "void main(){",
          "  vec3 c = texture2D(src, uv).rgb * 0.227027;",
          "  c += texture2D(src, uv + dir * 1.3846).rgb * 0.316216; c += texture2D(src, uv - dir * 1.3846).rgb * 0.316216;",
          "  c += texture2D(src, uv + dir * 3.2308).rgb * 0.070270; c += texture2D(src, uv - dir * 3.2308).rgb * 0.070270;",
          "  gl_FragColor = vec4(c, 1.0);",
          "}",
        ].join("\n");
        var COMPOSITE_FS = [
          "precision highp float;",
          "uniform sampler2D scene, bloomA, bloomB, bg;",
          "uniform float bgOn;",
          "uniform vec3 mainCol, hiCol;",
          "uniform float loud, kick, t;",
          "varying vec2 uv;",
          "float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }",
          "void main(){",
          "  float horizon = 0.585;",
          "  float dy = uv.y - horizon;",
          "  vec3 sky = mix(mainCol * 0.05, vec3(0.008, 0.004, 0.003), smoothstep(0.0, 0.35, dy));",
          "  sky += texture2D(bg, uv).rgb * 0.35 * bgOn;",
          "  float haze = exp(-pow(dy * 7.0, 2.0)) * exp(-pow((uv.x - 0.5) * 1.6, 2.0));",
          "  sky += mainCol * haze * (0.16 + 0.22 * loud + 0.25 * kick);",
          "  sky += hiCol * exp(-pow(dy * 40.0, 2.0)) * exp(-pow((uv.x - 0.5) * 2.4, 2.0)) * (0.05 + 0.12 * loud);",
          "  vec3 c = sky + texture2D(scene, uv).rgb + texture2D(bloomA, uv).rgb * 1.1 + texture2D(bloomB, uv).rgb * (1.4 + kick);",
          "  c = vec3(1.0) - exp(-c * 1.6);",
          "  float v = smoothstep(1.15, 0.35, length((uv - 0.5) * vec2(1.25, 1.0)));",
          "  c *= mix(0.55, 1.0, v);",
          "  // film grain: subtle (±0.009) and changing only 6 times a second, so files stay small",
          "  c += (hash(floor(uv * vec2(960.0, 540.0)) + floor(t * 6.0)) - 0.5) * 0.018;",
          "  gl_FragColor = vec4(c, 1.0);",
          "}",
        ].join("\n");

        // ---------- set up drawing (any error is shown on the frame) ----------
        function setup() {
          var audio = V.createAudio(window.AUDIO_DATA, {
            beatRange: setting("beatRange"),
            spectrumLow: setting("spectrumLow"),
            spectrumHigh: setting("spectrumHigh"),
            spectrumBoost: Number(setting("spectrumBoost")),
          });
          var MAIN = V.hexToRGB(setting("mainColor"));
          var HI = V.hexToRGB(setting("highlightColor"));
          var INT = setting("intensity");
          // Squared, so low values add a subtle drift and 100 % is a full rainbow.
          var TINT = Math.pow(setting("tint") / 100, 2);
          var SHOW_BG = setting("showBackground") === true;
          var BG_BLUR = setting("backgroundBlur");
          var DX = setting("densityX"),
            DY = setting("densityY");
          var WAVE_K = 100 / setting("waveScale");
          var WAVE_H = setting("waveHeight") / 100;
          var FLOW = setting("flowSpeed") / 100;
          var EVO = setting("waveSpeed") / 100;
          // Fewer particles get bigger (and more get smaller) so the field stays as full.
          var SIZE_MUL = Math.min(2, Math.max(0.75, Math.sqrt(100 / Math.sqrt(DX * DY))));
          // ...and brighter, since the glow is the sum of many particles.
          var DENS_GAIN = Math.min(4, Math.max(0.75, Math.sqrt(10000 / (DX * DY))));

          var W = Math.round(1920 * PREVIEW_SCALE),
            H = Math.round(1080 * PREVIEW_SCALE);
          var canvas = document.getElementById("viz");
          if (canvas.width !== W) canvas.width = W;
          if (canvas.height !== H) canvas.height = H;
          var rawGl = canvas.getContext("webgl", {
            preserveDrawingBuffer: true,
            antialias: false,
            alpha: false,
          });
          if (!rawGl) throw new Error("WebGL is not available in this browser");
          // Everything made through `gl` is freed by dispose(), so live changes don't leak.
          var tracked = V.trackGl(rawGl);
          var gl = tracked.gl;

          var scene = V.createTarget(gl, W, H);
          var hA = V.createTarget(gl, Math.round(W / 2), Math.round(H / 2)),
            hB = V.createTarget(gl, Math.round(W / 2), Math.round(H / 2));
          var qA = V.createTarget(gl, Math.round(W / 8), Math.round(H / 8)),
            qB = V.createTarget(gl, Math.round(W / 8), Math.round(H / 8));

          // Spectrum history: one row per 0.05 s into the past (row 0 = now).
          var NB = 32,
            ROWS_HIST = 120,
            HIST_DT = 0.05;
          var specTex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, specTex);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          var specBytes = new Uint8Array(NB * ROWS_HIST);
          var row = new Float32Array(NB);

          // Background image (optional): drawn once, cover-cropped and blurred, as a texture.
          var bgTex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, bgTex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          var black = new Uint8Array([0, 0, 0, 255]);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, black);
          var bgReady = false;
          function loadBackground() {
            var img = document.getElementById("bgImage");
            if (bgReady || !SHOW_BG || !img || !img.complete || !img.naturalWidth) return;
            var c2 = document.createElement("canvas");
            c2.width = W;
            c2.height = H;
            var ctx = c2.getContext("2d");
            var blurPx = (BG_BLUR / 100) * 80 * PREVIEW_SCALE;
            ctx.filter = blurPx > 0 ? "blur(" + blurPx + "px)" : "none";
            var pad = blurPx * 2; // draw past the edges so the blur doesn't darken them
            var scale = Math.max(
              (W + 2 * pad) / img.naturalWidth,
              (H + 2 * pad) / img.naturalHeight,
            );
            var dw = img.naturalWidth * scale,
              dh = img.naturalHeight * scale;
            ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
            gl.bindTexture(gl.TEXTURE_2D, bgTex);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            bgReady = true;
          }

          // Particle grid: columns across, rows into the distance.
          var COLS = Math.max(2, Math.round((560 * DX) / 100)),
            ROWS = Math.max(2, Math.round((120 * DY) / 100));
          var grid = new Float32Array(COLS * ROWS * 3);
          for (var r = 0; r < ROWS; r++)
            for (var c = 0; c < COLS; c++) {
              var o = (r * COLS + c) * 3;
              grid[o] = c / (COLS - 1);
              grid[o + 1] = r / (ROWS - 1);
              grid[o + 2] = (((c * 73856093) ^ (r * 19349663)) % 1000) / 1000; // per-particle id
            }
          var gridBuf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf);
          gl.bufferData(gl.ARRAY_BUFFER, grid, gl.STATIC_DRAW);

          var pProg = V.createProgram(gl, PARTICLE_VS, PARTICLE_FS);
          var copyProg = V.createProgram(gl, QUAD_VS, COPY_FS);
          var blurProg = V.createProgram(gl, QUAD_VS, BLUR_FS);
          var compProg = V.createProgram(gl, QUAD_VS, COMPOSITE_FS);

          function bindTarget(tg) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, tg ? tg.fb : null);
            gl.viewport(0, 0, tg ? tg.w : W, tg ? tg.h : H);
          }
          function copy(src, dst) {
            bindTarget(dst);
            gl.useProgram(copyProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, src.tex);
            gl.uniform1i(copyProg.u.src, 0);
            V.drawQuad(gl, copyProg);
          }
          function drawPoints(prog, buffer, name, size, count) {
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            var loc = gl.getAttribLocation(prog, name);
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
            gl.drawArrays(gl.POINTS, 0, count);
            gl.disableVertexAttribArray(loc);
          }

          function renderAt(t) {
            loadBackground();
            var a = audio.sample(t);
            for (var r = 0; r < ROWS_HIST; r++) {
              var past = t - r * HIST_DT;
              audio.spectrum(past, row); // silent before the song begins
              for (var k = 0; k < NB; k++) specBytes[r * NB + k] = Math.round(row[k] * 255);
            }
            gl.bindTexture(gl.TEXTURE_2D, specTex);
            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.LUMINANCE,
              NB,
              ROWS_HIST,
              0,
              gl.LUMINANCE,
              gl.UNSIGNED_BYTE,
              specBytes,
            );

            var recent = audio.recentHits(t, 4),
              ages = [99, 99, 99, 99],
              strengths = [0, 0, 0, 0];
            for (var j = 0; j < recent.length; j++) {
              ages[j] = recent[j][0];
              strengths[j] = recent[j][1];
            }

            // 1. scene: the particles, added together (additive light)
            bindTarget(scene);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE);
            gl.useProgram(pProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, specTex);
            gl.uniform1i(pProg.u.spec, 0);
            gl.uniform1f(pProg.u.t, t);
            gl.uniform1f(pProg.u.loud, a.loud);
            gl.uniform1f(pProg.u.kick, a.beat);
            gl.uniform1f(pProg.u.flux, a.flux);
            gl.uniform1f(pProg.u.inten, INT);
            gl.uniform4fv(pProg.u.hits, ages);
            gl.uniform4fv(pProg.u.hitStr, strengths);
            gl.uniform3fv(pProg.u.mainCol, MAIN);
            gl.uniform3fv(pProg.u.hiCol, HI);
            gl.uniform1f(pProg.u.waveK, WAVE_K);
            gl.uniform1f(pProg.u.waveH, WAVE_H);
            gl.uniform1f(pProg.u.flow, FLOW);
            gl.uniform1f(pProg.u.evo, EVO);
            gl.uniform1f(pProg.u.sizeMul, SIZE_MUL * PREVIEW_SCALE);
            gl.uniform1f(pProg.u.densGain, DENS_GAIN);
            gl.uniform1f(pProg.u.tint, TINT);
            drawPoints(pProg, gridBuf, "g", 3, COLS * ROWS);
            gl.disable(gl.BLEND);

            // 2. bloom: half-size medium glow, eighth-size wide glow
            copy(scene, hA);
            V.blur(gl, blurProg, hA, hB, 1.5);
            V.blur(gl, blurProg, hA, hB, 3.0);
            copy(hA, qA);
            V.blur(gl, blurProg, qA, qB, 1.5);
            V.blur(gl, blurProg, qA, qB, 3.0);

            // 3. sky, haze and glow combined onto the screen
            bindTarget(null);
            gl.useProgram(compProg);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, scene.tex);
            gl.uniform1i(compProg.u.scene, 0);
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, hA.tex);
            gl.uniform1i(compProg.u.bloomA, 1);
            gl.activeTexture(gl.TEXTURE2);
            gl.bindTexture(gl.TEXTURE_2D, qA.tex);
            gl.uniform1i(compProg.u.bloomB, 2);
            gl.activeTexture(gl.TEXTURE3);
            gl.bindTexture(gl.TEXTURE_2D, bgTex);
            gl.uniform1i(compProg.u.bg, 3);
            gl.uniform1f(compProg.u.bgOn, bgReady ? 1 : 0);
            gl.uniform3fv(compProg.u.mainCol, MAIN);
            gl.uniform3fv(compProg.u.hiCol, HI);
            gl.uniform1f(compProg.u.loud, a.loud);
            gl.uniform1f(compProg.u.kick, a.beat);
            gl.uniform1f(compProg.u.t, t);
            V.drawQuad(gl, compProg);
            gl.activeTexture(gl.TEXTURE0);
          }
          return { render: renderAt, dispose: tracked.dispose };
        }

        function fail(error) {
          V.showError(String((error && error.message) || error));
        }
        var drawing = null; // { render(t), dispose() } from setup()
        var lastTime = -1;
        function draw(t) {
          if (!drawing) return;
          try {
            drawing.render(t);
            lastTime = t;
          } catch (error) {
            drawing = null;
            fail(error);
          }
        }
        /** (Re)create everything that depends on the settings, freeing what came before. */
        function rebuild() {
          if (drawing) drawing.dispose();
          drawing = null;
          try {
            drawing = setup();
            var shown = document.getElementById("viz-error");
            if (shown) shown.remove();
          } catch (error) {
            fail(error);
          }
        }
        rebuild();
        fitTitles();
        draw(0);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitles);
        window.addEventListener("hf-seek", function (e) {
          fitTitles(); // titles are measured here, not in the timeline callback below
          draw(e.detail.time);
        });

        // Live preview (the editor): new settings or a new preview resolution arrive as
        // runtime data. Renders never send any, so they look exactly as without this.
        var hf = window.__hyperframes;
        if (hf && hf.registerRuntimeDataHandler) {
          hf.registerRuntimeDataHandler("settings", function (values) {
            if (!values || typeof values !== "object") return;
            for (var key in values) if (key in DEFAULTS) vars[key] = values[key];
            document.getElementById("title").textContent = setting("title");
            document.getElementById("artist").textContent = setting("artist");
            fitted = "";
            applyPage();
            fitTitles();
            rebuild();
            draw(Math.max(0, lastTime));
          });
          hf.registerRuntimeDataHandler("preview", function (data) {
            var scale = Number(data && data.scale);
            if (!(scale > 0 && scale <= 1) || scale === PREVIEW_SCALE) return;
            PREVIEW_SCALE = scale;
            rebuild();
            draw(Math.max(0, lastTime));
          });
        }

        // Titles fade in; the whole picture fades to black over the song's last 2.5 s.
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#titles",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 1.6, ease: "power2.out" },
          0.3,
        );
        tl.to(
          "#fade",
          { opacity: 1, duration: 2.5, ease: "power1.in" },
          Math.max(0, DURATION - 2.5),
        );
        // While the preview plays, the runtime advances this timeline (hf-seek only comes on
        // jumps), so draw on every timeline update too.
        tl.eventCallback("onUpdate", function () {
          var t = tl.time();
          if (t !== lastTime) draw(t);
        });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
