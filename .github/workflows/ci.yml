# Runs the full project check (lint, formatting, types, all TypeScript and Python tests) on
# Linux for every change, so the app is known to work on the cloud machine before anyone pays
# for one. The owner's PC is Windows; this proves the same code on Ubuntu.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run setup:py
      - run: npm run check
      # Only a production build catches some page errors (e.g. prerendering rules).
      - run: npm run build
