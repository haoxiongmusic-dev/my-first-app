# Builds the container image for the online test version, smoke-tests it (start, login gate,
# a 2-second render), and publishes it to the GitHub Container Registry:
#   ghcr.io/haoxiongmusic-dev/my-first-app:sha-<commit>  (every build)
#   ghcr.io/haoxiongmusic-dev/my-first-app:latest        (main only)
name: Image

on:
  push:
    branches: [main, feat/online-test]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The CUDA base image and Chrome are big: make room on the runner first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: my-first-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image ls my-first-app:test

      - name: Smoke test
        run: bash scripts/smoke-image.sh my-first-app:test

      - name: Publish
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/my-first-app
          SHA=sha-${GITHUB_SHA::7}
          docker tag my-first-app:test "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag my-first-app:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "Published $IMAGE:$SHA"
